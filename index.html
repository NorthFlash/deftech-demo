    { id: 'sp-ngi', name: 'Next Generation Interceptor (NGI)', maker: 'Lockheed Martin', country: 'США', type: 'missiles', stage: 'dev', q: 'Next Generation Interceptor',
      img: 'https://thedefensepost.com/wp-content/uploads/2024/04/Lockheed_Martin_NGI_in_flight-scaled.jpg',
      blurb: 'Новий перехоплювач для наземної системи протиракетної оборони середньої ділянки траєкторії (GMD), що має замінити ракети GBI на Алясці та в Каліфорнії. NGI отримає модульну архітектуру та кілька кінетичних бойових блоків для ураження боєголовок і хибних цілей. У 2026 році Lockheed Martin провела випробування корпусу та двигуна другого ступеня й відкрила складальний цех у Кортленді (Алабама).',
      blurb_en: 'A new interceptor for the Ground-based Midcourse Defense (GMD) system, intended to replace the GBI missiles in Alaska and California. NGI will have a modular architecture and multiple kinetic kill vehicles to defeat warheads and decoys. In 2026 Lockheed Martin tested the second-stage case and motor and opened an assembly facility in Courtland, Alabama.',
      specs: [['Замовник', 'Агентство протиракетної оборони США (MDA)'], ['Бойове навантаження', 'кілька кінетичних перехоплювачів'], ['Плановий термін розгортання', 'до 2030 р.']],
      specs_en: [['Customer', 'US Missile Defense Agency (MDA)'], ['Payload', 'multiple kinetic kill vehicles'], ['Planned deployment', 'by 2030']],
      links: [['Сайт виробника', 'https://www.lockheedmartin.com/en-us/capabilities/space/space-missile-defense.html'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/08/05/lockheed-next-generation-interceptor-test/']] },
    { id: 'sp-nextgenopir', name: 'Next-Gen OPIR GEO', maker: 'Lockheed Martin, Raytheon (RTX)', country: 'США', type: 'space', stage: 'test', q: 'Next-Gen OPIR',
      img: 'https://thedefensepost.com/wp-content/uploads/2026/04/Next-Gen-OPIR-GEO-satellite.jpg',
      blurb: 'Геостаціонарні супутники раннього попередження про ракетний напад, які мають замінити систему SBIRS. Інфрачервоні сенсори Raytheon виявляють теплові сліди пусків, зокрема гіперзвукових ракет. Перший супутник уже зібрано, однак його запуск на ракеті Vulcan Centaur неодноразово переносили.',
      blurb_en: 'Geostationary missile warning satellites intended to replace the SBIRS system. Raytheon’s infrared sensors detect the heat signatures of launches, including hypersonic missiles. The first satellite has already been assembled, but its launch on a Vulcan Centaur rocket has been repeatedly postponed.',
      specs: [['Орбіта', 'геостаціонарна (GEO), Block 0'], ['Контракт Lockheed Martin', '4,9 млрд дол. (2021)'], ['Ракета-носій', 'Vulcan Centaur']],
      specs_en: [['Orbit', 'geostationary (GEO), Block 0'], ['Lockheed Martin contract', '$4.9 billion (2021)'], ['Launch vehicle', 'Vulcan Centaur']],
      links: [['Джерело: RTX', 'https://www.rtx.com/news/news-center/2026/04/28/rtxs-raytheon-delivers-second-missile-warning-sensor-to-u-s-space-force'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/04/29/raytheon-sensor-geo-ussf/']] },
    { id: 'sp-sentinel', name: 'LGM-35A Sentinel', maker: 'Northrop Grumman', country: 'США', type: 'missiles', stage: 'dev', upd: '2026-09-22', q: 'Sentinel',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/H6PY7OK7PRCTVF4JDT3RN6YZP4.jpg?width=1200&auth=16b9ece95e513cf88460179121f2ffdf346dfbe72144075f4909670c9f8441a5',
      blurb: 'Нова міжконтинентальна балістична ракета ВПС США, що має замінити Minuteman III у наземній ядерній тріаді. Після перевищення кошторису та порушення Нанна–Маккерді програму реструктуризують, а замість модернізації старих шахт будують нові. У вересні 2026 року на базі Ванденберг завершили вертикальне складання інертної ракети, льотні випробування заплановано на 2027 рік.',
      blurb_en: 'The US Air Force’s new intercontinental ballistic missile, intended to replace Minuteman III in the land-based leg of the nuclear triad. After cost overruns and a Nunn–McCurdy breach, the programme is being restructured, and new silos are being built instead of upgrading the old ones. In September 2026 vertical assembly of an inert missile was completed at Vandenberg, with flight testing planned for 2027.',
      specs: [['Кількість ракет', '400'], ['Оцінка вартості', '141 млрд дол.'], ['Початкова боєготовність', 'початок 2030-х']],
      specs_en: [['Number of missiles', '400'], ['Cost estimate', '$141 billion'], ['Initial operational capability', 'early 2030s']],
      links: [['Джерело: Military Times', 'https://militarytimes.com/industry/techwatch/2026/09/22/sentinel-icbm-achieves-vertical-stacking-ahead-of-2027-initial-flight-testing'], ['Джерело: Breaking Defense', 'https://breakingdefense.com/2026/02/exclusive-sentinel-icbm-to-clear-key-review-this-year-go-operational-in-early-2030s/']] },
    { id: 'sp-cps', name: 'Conventional Prompt Strike (CPS)', maker: 'Lockheed Martin / ВМС США', country: 'США', type: 'missiles', stage: 'test', q: 'Conventional Prompt Strike',
      maker_en: 'Lockheed Martin / US Navy',
      img: 'https://www.armyrecognition.com/images/stories/news/2026/july/U.S.%20Navy%20Delays%20Zumwalt%20Hypersonic%20Missile%20Test%20to%202027%20as%20Costs%20Reach%202%20Billion.jpg',
      blurb: 'Морська гіперзвукова ракета з планерним бойовим блоком, яку розміщують на есмінцях класу Zumwalt, а згодом — на підводних човнах Virginia. На Zumwalt замість артилерійських систем встановлюють чотири великі пускові шахти. За даними GAO, програма відстає приблизно на два роки, а перший пуск із корабля перенесли на 2027 фінансовий рік.',
      blurb_en: 'A sea-based hypersonic missile with a glide body, being fitted to Zumwalt-class destroyers and later to Virginia-class submarines. On Zumwalt, four large launch tubes replace the gun systems. According to the GAO, the programme is about two years behind schedule, and the first shipboard launch has slipped to fiscal year 2027.',
      specs: [['Пускова установка на Zumwalt', '4 шахти по 3 ракети (до 12)'], ['Вартість ракети', 'близько 67 млн дол.'], ['Швидкість', 'понад 5 М']],
      specs_en: [['Zumwalt launcher', '4 tubes of 3 missiles each (up to 12)'], ['Missile cost', 'about $67 million'], ['Speed', 'over Mach 5']],
      links: [['Джерело: Army Recognition', 'https://www.armyrecognition.com/news/navy-news/2026/u-s-navy-delays-zumwalt-hypersonic-missile-test-to-2027-as-costs-reach-2-billion']] },
    { id: 'sp-tomahawk-blockv', name: 'Tomahawk Block V / Maritime Strike', maker: 'Raytheon (RTX)', country: 'США', type: 'missiles', stage: 'service', q: 'Tomahawk',
      img: 'https://thedefensepost.com/wp-content/uploads/2021/11/tomahawk_hero_lg.jpg',
      blurb: 'Остання модифікація крилатої ракети морського базування Tomahawk, яка, крім ударів по наземних цілях, отримує здатність уражати кораблі. ВМС США продовжують закупівлі Block V, а семирічний багаторічний контракт із Raytheon має підняти річний випуск Tomahawk понад тисячу ракет. Ракети запускають із надводних кораблів і підводних човнів.',
      blurb_en: 'The latest variant of the sea-launched Tomahawk cruise missile, which in addition to land-attack strikes gains the ability to hit ships. The US Navy continues to buy Block V, and a seven-year multiyear contract with Raytheon is set to raise annual Tomahawk output to over a thousand missiles. The missiles are launched from surface ships and submarines.',
      specs: [['Багаторічний контракт', '22,9 млрд дол. на 7 років'], ['Цільовий темп випуску', 'понад 1000 ракет на рік'], ['Носії', 'надводні кораблі та підводні човни']],
      specs_en: [['Multiyear contract', '$22.9 billion over 7 years'], ['Target production rate', 'over 1,000 missiles per year'], ['Platforms', 'surface ships and submarines']],
      links: [['Джерело: The Defense Post', 'https://thedefensepost.com/2026/08/18/us-raytheon-tomahawk-production/'], ['Джерело: The Defense Post (контракт на модернізацію)', 'https://thedefensepost.com/2026/01/27/raytheon-tomahawk-upgrades']] },
    { id: 'sp-jsm', name: 'Joint Strike Missile (JSM)', maker: 'Kongsberg Defence & Aerospace', country: 'Норвегія', type: 'missiles', stage: 'prod', q: 'Joint Strike Missile',
      img: 'https://aeromorning.com/en/wp-content/uploads/sites/2/2026/06/kongsberg.jpg',
      blurb: 'Малопомітна авіаційна ракета п’ятого покоління для ударів по морських і наземних цілях, яка може розміщуватися у внутрішньому відсіку F-35A без втрати його малопомітності. Ракету обрали Японія, Норвегія, Австралія, Німеччина та США. У червні 2026 року Kongsberg отримала новий контракт від ВПС США.',
      blurb_en: 'A fifth-generation low-observable air-launched missile for strikes on sea and land targets that can be carried in the F-35A’s internal bay without compromising its stealth. The missile has been selected by Japan, Norway, Australia, Germany and the United States. In June 2026 Kongsberg received a new contract from the US Air Force.',
      specs: [['Носій', 'F-35A (внутрішній відсік)'], ['Контракт ВПС США (2026)', 'близько 2,7 млрд крон (~250 млн євро)'], ['Завершення поставок за контрактом', 'до кінця 2029 р.']],
      specs_en: [['Platform', 'F-35A (internal bay)'], ['US Air Force contract (2026)', 'about NOK 2.7 billion (~€250 million)'], ['Contract deliveries complete', 'by end of 2029']],
      links: [['Сайт виробника', 'https://kongsberg.com/news/news-archive/2026/kongsberg-to-deliver-more-jsm-missiles-to-us-air-force'], ['Джерело: AeroMorning', 'https://aeromorning.com/en/kongsberg-to-deliver-more-jsm-missiles-to-us-air-force/']] },
    { id: 'sp-asn4g', name: 'ASN4G', maker: 'MBDA', country: 'Франція', type: 'missiles', stage: 'dev', q: 'ASN4G',
      img: 'https://www.navalnews.com/wp-content/uploads/2026/06/Demosntrateur-Themis.jpg',
      blurb: 'Гіперзвукова крилата ракета з ядерною бойовою частиною четвертого покоління для повітряного компонента французького ядерного стримування. У червні 2026 року агентство DGA доручило MBDA її розроблення; ракета має замінити модернізовану ASMPA. Носієм стане Rafale F5 стратегічних і палубних ядерних сил.',
      blurb_en: 'A fourth-generation nuclear-armed hypersonic cruise missile for the airborne component of France’s nuclear deterrent. In June 2026 the DGA tasked MBDA with its development; the missile is to replace the upgraded ASMPA. Its carrier will be the Rafale F5 of the strategic and carrier-based nuclear forces.',
      specs: [['Носій', 'Rafale F5'], ['Замінює', 'ASMPA (модернізовану)'], ['Очікуваний вступ на озброєння', 'близько 2035 р.']],
      specs_en: [['Platform', 'Rafale F5'], ['Replaces', 'ASMPA (upgraded)'], ['Expected entry into service', 'around 2035']],
      links: [['Джерело: Naval News', 'https://www.navalnews.com/naval-news/2026/06/french-dga-commissions-mbda-to-develop-asn4g-hypersonic-missile/'], ['Джерело: The Aviationist', 'https://theaviationist.com/2026/06/13/france-asn4g-hypersonic-nuclear-missile/']] },
    { id: 'sp-elsa', name: 'ELSA (European Long-range Strike Approach)', maker: 'Міністерства оборони Великої Британії, Франції, Німеччини, Польщі, Італії та Швеції', country: 'Європа', type: 'missiles', stage: 'dev', q: 'ELSA',
      maker_en: 'Ministries of Defence of the United Kingdom, France, Germany, Poland, Italy and Sweden',
      img: 'https://www.calibredefence.co.uk/wp-content/uploads/2026/02/poland_ELSA_communique.jpg',
      blurb: 'Спільна ініціатива шести європейських держав зі створення власних засобів високоточного ураження на великій дальності. Спочатку йшлося про крилату ракету наземного базування з дальністю 1000–2000 км, а у лютому 2026 року роботу розподілили між кількома напрямами — від авіаційної далекобійної зброї до дешевих засобів ураження з дальністю понад 500 км.',
      blurb_en: 'A joint initiative of six European states to develop their own long-range precision strike capabilities. It initially focused on a ground-launched cruise missile with a range of 1,000–2,000 km, and in February 2026 the work was split into several strands, from air-launched long-range weapons to low-cost strike weapons with a range of over 500 km.',
      specs: [['Учасники', '6 країн'], ['Початковий орієнтир дальності', '1000–2000 км'], ['Напрями роботи', 'авіаційна зброя, Euro Multi Missile Launcher, дешеві засоби ураження 500+ км, ДРЛВ']],
      specs_en: [['Participants', '6 countries'], ['Initial range target', '1,000–2,000 km'], ['Work strands', 'air-launched weapons, Euro Multi Missile Launcher, low-cost 500+ km strike weapons, AEW']],
      links: [['Джерело: Calibre Defence', 'https://www.calibredefence.co.uk/elsa-europe-goes-it-alone-on-long-range-strike/'], ['Джерело: Міноборони Польщі', 'https://www.gov.pl/web/national-defence/joint-communiqu-by-the-defence-ministries-of-elsa-nations']] },
    { id: 'sp-stratus', name: 'STRATUS (FC/ASW)', maker: 'MBDA', country: 'Велика Британія, Франція', type: 'missiles', stage: 'dev', q: 'STRATUS',
      img: 'https://www.navalnews.com/wp-content/uploads/2025/09/MBDA-STRATUS-FCASW-missile-family-DSEI-UK-2025.jpg',
      blurb: 'Британсько-французька програма крилатих і протикорабельних ракет нового покоління, відома раніше як FC/ASW. Сімейство складається з малопомітної дозвукової STRATUS LO та швидкісної маневрової STRATUS RS для пусків із літаків, кораблів і наземних платформ. Ракети мають замінити Harpoon і Storm Shadow; рішення щодо повного бізнес-кейсу у Великій Британії очікується у 2026 році.',
      blurb_en: 'A British-French programme for next-generation cruise and anti-ship missiles, formerly known as FC/ASW. The family consists of the low-observable subsonic STRATUS LO and the high-speed manoeuvring STRATUS RS, for launch from aircraft, ships and ground platforms. The missiles are to replace Harpoon and Storm Shadow; a UK decision on the full business case is expected in 2026.',
      specs: [['Варіанти', 'STRATUS LO (малопомітна), STRATUS RS (швидкісна)'], ['Замінює', 'Harpoon, Storm Shadow'], ['Інженерів у програмі', 'понад 750']],
      specs_en: [['Variants', 'STRATUS LO (low-observable), STRATUS RS (high-speed)'], ['Replaces', 'Harpoon, Storm Shadow'], ['Engineers on the programme', 'over 750']],
      links: [['Джерело: Naval News', 'https://www.navalnews.com/?p=77924'], ['Джерело: UK Defence Journal', 'https://ukdefencejournal.org.uk/future-uk-anti-ship-missile-programme-decision-due-soon']] },
    { id: 'sp-gps-iiif', name: 'GPS IIIF', maker: 'Lockheed Martin', country: 'США', type: 'space', stage: 'prod', q: 'GPS IIIF',
      blurb: 'Наступна серія навігаційних супутників GPS для Космічних сил США з посиленим захистом від радіоелектронної боротьби. Функція Regional Military Protection має покращити стійкість до глушіння понад у 60 разів, а супутники отримують захищений військовий сигнал M-Code і рятувальне корисне навантаження. У квітні 2026 року Lockheed Martin завершила ключовий етап складання першого супутника серії SV11.',
      blurb_en: 'The next series of GPS navigation satellites for the US Space Force with enhanced protection against electronic warfare. The Regional Military Protection capability is to improve jamming resistance by more than 60 times, and the satellites carry the secure military M-Code signal and a search-and-rescue payload. In April 2026 Lockheed Martin completed a key assembly milestone for the first satellite in the series, SV11.',
      specs: [['Стійкість до глушіння', 'понад у 60 разів вища (Regional Military Protection)'], ['Контракт', 'до супутника SV22'], ['Платформа (з SV13)', 'LM2100 Combat Bus']],
      specs_en: [['Jamming resistance', 'over 60 times higher (Regional Military Protection)'], ['Contract', 'up to satellite SV22'], ['Platform (from SV13)', 'LM2100 Combat Bus']],
      links: [['Сайт виробника', 'https://news.lockheedmartin.com/2026-04-29-Lockheed-Martin-Completes-Critical-Production-Milestone-for-Next-Generation-GPS-IIIF-Satellites']] },
    { id: 'sp-kusha', name: 'Project Kusha (LRSAM)', maker: 'DRDO', country: 'Індія', type: 'missiles', stage: 'test', q: 'Kusha',
      img: 'https://staticprintenglish.theprint.in/wp-content/uploads/2026/07/Untitled-design-98-1.png',
      blurb: 'Індійська зенітна ракетна система великої дальності, яку часто називають «національним S-400». У липні 2026 року DRDO провела перший льотний тест і перехопила імітовану високошвидкісну висотну ціль. Система має доповнити S-400 і стати ключовим елементом майбутнього протиповітряної «парасольки» Sudarshan Chakra.',
      blurb_en: 'An Indian long-range surface-to-air missile system often called the “national S-400”. In July 2026 DRDO conducted the first flight test and intercepted a simulated high-speed, high-altitude target. The system is to complement the S-400 and become a key element of the future Sudarshan Chakra air defence “umbrella”.',
      specs: [['Дальність перехоплювачів', 'M1 — 150 км, M2 — 250 км, M3 — 350–400 км'], ['Схвалена закупівля', '5 ескадрилій, 21 700 крор рупій'], ['Перший льотний тест', 'липень 2026 р.']],
      specs_en: [['Interceptor range', 'M1: 150 km, M2: 250 km, M3: 350–400 km'], ['Approved procurement', '5 squadrons, ₹21,700 crore'], ['First flight test', 'July 2026']],
      links: [['Джерело: ThePrint', 'https://theprint.in/defence/project-kusha-indias-desi-s-400-takes-to-the-skies-maiden-test-flight-successful/2994844/']] },
    { id: 'sp-arrow3-germany', name: 'Arrow 3 (Німеччина)', maker: 'Israel Aerospace Industries (IAI)', country: 'Ізраїль', type: 'missiles', stage: 'service', q: 'Arrow 3',
      name_en: 'Arrow 3 (Germany)',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/EPMSLCT5BFDNNPW5376N5KE6ME.jpg?width=1200&auth=4eaa0cd3a62e5d9c0fa873e6d5e545c04225295de596078ee4ba5b9e18905890',
      blurb: 'Ізраїльська система перехоплення балістичних ракет за межами атмосфери, яку Німеччина розгорнула як перший оператор за межами Ізраїлю. Першу батарею активували у грудні 2025 року в Хольцдорфі, а в липні 2026 року Берлін оголосив другу позицію на півдні країни.',
      blurb_en: 'An Israeli exo-atmospheric ballistic missile interception system, deployed by Germany as the first operator outside Israel. The first battery was activated in December 2025 at Holzdorf, and in July 2026 Berlin announced a second site in the south of the country.',
      specs: [['Перша батарея в Німеччині', 'грудень 2025 р., Хольцдорф'], ['Загальна вартість німецьких закупівель', 'понад 6,5 млрд дол.'], ['Наступний контракт', '3,1 млрд дол. (грудень 2025 р.)']],
      specs_en: [['First battery in Germany', 'December 2025, Holzdorf'], ['Total cost of German procurement', 'over $6.5 billion'], ['Follow-on contract', '$3.1 billion (December 2025)']],
      links: [['Джерело: Defense News', 'https://www.defensenews.com/global/europe/2026/07/01/germany-expands-its-exoatmospheric-missile-shield-with-second-arrow-3-deployment/']] },
    { id: 'u740-valkyrie', name: 'U740 Valkyrie', maker: 'Airbus Defence and Space та Kratos', country: 'Німеччина та США', type: 'air', stage: 'test', upd: '2026-10-13', q: 'Valkyrie',
      maker_en: 'Airbus Defence and Space and Kratos',
      img: 'https://theaviationist.com/wp-content/uploads/2026/10/Airbus-U740-Valkyrie-First-Flight-photo-01_Valkyrie_HeroShots_0009_8022.jpg',

    { id: 'cxmhr', name: 'cxMHR', maker: 'Leonardo DRS', country: 'США', type: 'electronic', stage: 'prod', upd: '2026-10-14', q: 'cxMHR',

    { id: 'ua-fjet80', name: 'F-Jet 80', maker: 'F-Drones', country: 'Україна', type: 'unmanned', stage: 'test', upd: '2026-10-27', q: 'F-Jet 80',

    { id: 'xq67a', name: 'XQ-67A', maker: 'General Atomics Aeronautical Systems', country: 'США', type: 'unmanned', stage: 'test', upd: '2026-10-28', q: 'XQ-67A',

  function mountMap() {
    var st = ConflictMap.stats();
    $('map-date').textContent = L('Станом на ' + CONFLICTS_AS_OF.label, 'As of ' + ConflictMap.enDate(CONFLICTS_AS_OF.label));
    $('map-stat').textContent = L(st.total + ' гарячих точок · ' + st.hot + ' — загострення та нові конфлікти', st.total + ' hotspots · ' + st.hot + ' escalations and new conflicts');
    if (cmap) { cmap.refresh(); return; }
    cmap = ConflictMap.mount($('map-root'), {
      countNews: function (c) { return regionNews(c.id).length; },
      newsFor: function (c) { return regionNews(c.id).map(function (a) { return { id: a.id, title: title(a), src: src(a.src), ago: ago(a) }; }); },
      onArticle: function (id) { openArticle(id); },
      onNews: function (c) { state.region = c.id; state.query = ''; $('feed-q').value = ''; setTab('feed'); },
      scrollTo: function (el) { if (el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    });
  }

  function renderDetail() {
    var box = $('detail');
    var a = state.open && BY_ID[state.open];
    if (!a) { box.hidden = true; box.innerHTML = ''; return; }
    var isSaved = state.saved.indexOf(a.id) >= 0;
    var cl = state.cardLang || (EN() ? 'en' : 'uk'), ct = cl === 'en' ? a.t : (a.tr || a.t), cs = cl === 'en' ? a.s : (a.sr || a.s);
    box.innerHTML =
      '<div class="navbar">' +
        '<button class="icon-btn" data-back><svg width="13" height="22" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2L2 11l9 9"/></svg>' + tabTitle(state.tab) + '</button>' +
        '<button class="icon-btn" data-save aria-pressed="' + isSaved + '" aria-label="' + (isSaved ? L('Прибрати із закладок', 'Remove from saved') : L('Додати в закладки', 'Save')) + '">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="' + (isSaved ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="detail-body">' +
        '<div class="hero cover" style="--cc: var(--c-' + a.cats[0] + ')">' + icon(a.cats[0], 56) +
          '<span class="hero-cat">' + cat(a.cats[0]) + '</span><span class="hero-src">' + esc(src(a.src)) + ' · ' + esc(D(a.date)) + '</span>' +
          photoHTML(a, true) + '</div>' +
        '<div class="tags">' + a.cats.map(tagHTML).join('') + '</div>' +
        '<div class="detail-row"><div class="lang-card" role="radiogroup" aria-label="' + L('Мова картки', 'Card language') + '">' +
          [['uk', 'UA'], ['en', 'EN']].map(function (o) { return '<button role="radio" data-card-lang="' + o[0] + '" aria-checked="' + (cl === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div>' +
          (a.region || []).map(function (r) { return '<button class="region-chip" data-region-go="' + r + '"><i></i>' + esc(ConflictMap.regionName(r)) + ' · ' + L('на карті', 'on the map') + '</button>'; }).join('') + '</div>' +
        '<h2>' + esc(ct) + '</h2>' +
        '<div class="byline"><b>' + esc(src(a.src)) + '</b>' + (a.author ? '<span>' + esc(a.author) + '</span>' : '') + '<span>' + esc(D(a.date)) + '</span></div>' +
        (a.sponsored ? '<span class="sponsor">' + L('Спонсорський матеріал', 'Sponsored') + '</span>' : '') +
        '<p class="summary">' + esc(cs) + '</p>' +
        (a.also && a.also.length ? '<div class="also"><small>' + L('Про це також пишуть', 'Also reported by') + '</small>' + a.also.map(function (id) { var b = BY_ID[id]; return b ? '<a href="' + esc(safeUrl(b.link)) + '" target="_blank" rel="noopener noreferrer">' + esc(src(b.src)) + ' ↗</a>' : ''; }).join('') + '</div>' : '') +
        '<div class="actions">' +
          '<a class="btn primary" href="' + esc(safeUrl(a.link)) + '" target="_blank" rel="noopener noreferrer">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>' +
            L('Читати на ', 'Read on ') + esc(src(a.src)) + '</a>' +
          '<button class="btn secondary" data-share>' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>' +
            L('Поділитися', 'Share') + '</button>' +
        '</div>' +
        '<p class="foot">' + L('Матеріал належить виданню ' + esc(src(a.src)) + '. У застосунку показано лише заголовок і короткий анонс із відкритої RSS-стрічки.', 'The article belongs to ' + esc(src(a.src)) + '. The app shows only the headline and a short summary from the open RSS feed.') + '</p>' +
      '</div>';
    box.hidden = false;
  }

  function renderAll() {
    renderToday(); renderFeed(); renderSaved(); renderSettings(); renderDetail();
  }

  function setTab(tab) {
    state.tab = tab; state.open = null;
    ['today', 'feed', 'map', 'innov', 'settings'].forEach(function (t) {
      $('screen-' + t).hidden = t !== tab;
    });
    document.querySelectorAll('.tab').forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    renderAll();
    if (tab === 'map') mountMap();
    if (tab === 'innov') mountInnov();
  }

  function openArticle(id) {
    state.open = id; state.cardLang = null;
    if (state.read.indexOf(id) < 0) { state.read.push(id); save(); }
    renderDetail();
    var box = $('detail');
    box.classList.add('entering');
    box.getBoundingClientRect();
    box.classList.remove('entering');
    box.querySelector('[data-back]').focus({ preventScroll: true });
  }

  document.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('.tab'))) { setTab(el.dataset.tab); return; }
    if ((el = e.target.closest('[data-open]'))) { openArticle(el.dataset.open); return; }
    if ((el = e.target.closest('[data-cat]'))) {
      var k = el.dataset.cat || null;
      state.cat = state.cat === k ? null : k;
      renderToday(); return;
    }
    if (e.target.closest('[data-back]')) { state.open = null; renderAll(); return; }
    if (e.target.closest('[data-save]')) {
      var i = state.saved.indexOf(state.open);
      if (i >= 0) state.saved.splice(i, 1); else state.saved.unshift(state.open);
      save(); renderAll(); return;
    }
    if ((el = e.target.closest('[data-card-lang]'))) { state.cardLang = el.dataset.cardLang; renderDetail(); return; }
    if (e.target.closest('[data-share]')) { var sa = BY_ID[state.open]; if (sa) Extras.share({ title: (state.cardLang || (EN() ? 'en' : 'uk')) === 'en' ? sa.t : (sa.tr || sa.t), url: sa.link, source: src(sa.src), when: D(sa.date) }); return; }
    if ((el = e.target.closest('[data-region-go]'))) { var rg = el.dataset.regionGo; setTab('map'); if (cmap) cmap.select(rg); return; }
    if (e.target.closest('[data-region-clear]')) { state.region = null; renderFeed(); return; }
    if (e.target.closest('#brief-open')) { openBrief(); return; }
    if ((el = e.target.closest('[data-hero-set]'))) {
      state.hero = el.dataset.heroSet; save(); mountHeroBg(); renderSettings(); return;
    }
    if ((el = e.target.closest('[data-lang-set]'))) {
      state.lang = el.dataset.langSet; UI_LANG = state.lang === 'en' ? 'en' : 'uk'; save(); relang(); return;
    }
    if ((el = e.target.closest('[data-theme-set]'))) {
      state.theme = el.dataset.themeSet; applyTheme(); save(); renderSettings(); return;
    }
    if ((el = e.target.closest('[data-toggle]'))) {
      state[el.dataset.toggle] = !state[el.dataset.toggle];
      save(); renderAll(); return;
    }
    if ((el = e.target.closest('[data-source]'))) {
      var id = el.dataset.source;
      if (state.off[id]) delete state.off[id]; else state.off[id] = true;
      save(); renderAll(); return;
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'digest-time' && e.target.value) {
      state.time = e.target.value; save(); renderSettings();
    }
  });

  $('feed-q').addEventListener('input', function (e) {
    state.query = e.target.value; renderFeed();
  });

  // Зміна мови: перемальовуємо все, карту й каталог монтуємо заново в чисті контейнери.
  function freshRoot(id) { var r = $(id), n = r.cloneNode(false); r.parentNode.replaceChild(n, r); return n; }
  function relang() {
    applyStatic();
    if (innov) { innov = null; freshRoot('iv-root'); }
    if (cmap) { cmap = null; freshRoot('map-root'); }
    renderAll();
    if (state.tab === 'map') mountMap();
    if (state.tab === 'innov') mountInnov();
  }

  function openBrief() {
    var list = todays(), withImg = list.filter(function (a) { return a.img; });
    var pick = withImg.slice(0, 6); if (pick.length < 6) pick = pick.concat(list.filter(function (a) { return !a.img; }).slice(0, 6 - pick.length));
    pick.sort(function (x, y) { return list.indexOf(x) - list.indexOf(y); });
    Extras.openBrief({ items: pick.map(function (a) { return { id: a.id, title: title(a), summary: summary(a), src: src(a.src), ago: ago(a), img: a.img, cat: cat(a.cats[0]), icon: icon(a.cats[0], 96) }; }), onRead: openArticle });
  }
  setInterval(function () { var el = $('asof-updated'); if (el) el.textContent = Extras.liveUpdated(NEWS_AS_OF) || updated(); }, 30000);

  applyStatic();
  renderAll();
  mountHeroBg();
})();
</script>

</body>
</html>
