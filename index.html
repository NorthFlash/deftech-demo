<style>
:root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }

[hidden] { display: none !important; }

<style>
/* Layout: one-screen iPhone app — large-title screens scroll above a fixed tab bar; article opens as a pushed card over the current tab. */
:root {
  --bg: #F6F7F2;
  --bg-grouped: #EDEFE6;
  --surface: #FCFCF9;
  --fill: #EAECE3;
  --fg: #111114;
  --fg-2: #5F5F66;
  --sep: #DFE2D6;
  --bar: #EFF1E9;
  --accent: #2F6B2B;
  --on-accent: #FFFFFF;
  --c-air: #1D5FBF;
  --c-naval: #0F6E6E;
  --c-land: #2F6B2B;
  --c-unmanned: #A14E00;
  --c-missiles: #B42318;
  --c-space: #4338CA;
  --c-electronic: #7E22CE;
  --c-ai: #A3195B;
  --c-industry: #7A5230;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10120E; --bg-grouped: #10120E; --surface: #191C16; --fill: #1C1F19; --fg: #F2F2F7; --fg-2: #A1A1A8;
    --sep: #2A2E25; --bar: #151713; --accent: #7CC46A; --on-accent: #0B1A0A;
    --c-air: #6EA8FF; --c-naval: #4FC7C7; --c-land: #7CC46A; --c-unmanned: #FFA552; --c-missiles: #FF7A6E;
    --c-space: #9B97FF; --c-electronic: #C98BFF; --c-ai: #FF7DB8; --c-industry: #D9A877;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10120E; --bg-grouped: #10120E; --surface: #191C16; --fill: #1C1F19; --fg: #F2F2F7; --fg-2: #A1A1A8;
  --sep: #2A2E25; --bar: #151713; --accent: #7CC46A; --on-accent: #0B1A0A;
  --c-air: #6EA8FF; --c-naval: #4FC7C7; --c-land: #7CC46A; --c-unmanned: #FFA552; --c-missiles: #FF7A6E;
  --c-space: #9B97FF; --c-electronic: #C98BFF; --c-ai: #FF7DB8; --c-industry: #D9A877;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
.stage { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.screen.grouped { background: var(--bg-grouped); }

.hdr { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 6px; }
.hdr h1 { margin: 0; font-family: var(--font-display); font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.2px; text-wrap: balance; }
.date { font-size: 15px; font-weight: 600; color: var(--accent); }
.stat { font-size: 15px; line-height: 20px; }
.muted { font-size: 12px; color: var(--fg-2); }
.demo { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--fg-2); background: var(--fill); padding: 3px 8px; border-radius: 6px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { --cc: var(--accent); flex-shrink: 0; display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid transparent; background: var(--fill); font-size: 14px; font-weight: 600; }
.chip .n { color: var(--fg-2); font-variant-numeric: tabular-nums; font-weight: 500; }
.chip[aria-pressed="true"] { color: var(--cc); border-color: var(--cc); background: color-mix(in srgb, var(--cc) 13%, var(--bg)); }

.list { border-top: 1px solid var(--sep); }
.row { --cc: var(--accent); display: flex; gap: 12px; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--sep); background: var(--bg); text-align: left; }
.row:active { background: var(--fill); }
.row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.row-meta { font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta b { font-weight: 600; }
.row-title { font-size: 16px; line-height: 21px; font-weight: 600; }
.row.read .row-title { color: var(--fg-2); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { --cc: var(--accent); font-size: 11px; line-height: 14px; font-weight: 600; padding: 3px 8px; border-radius: 10px; color: var(--cc); background: color-mix(in srgb, var(--cc) 12%, var(--bg)); }
.thumb { position: relative; overflow: hidden; flex-shrink: 0; width: 76px; height: 76px; border-radius: 12px; display: grid; place-items: center; color: var(--cc); }
/* Обкладинка-заглушка: блідий тон рубрики з м’яким світінням у правому верхньому куті, приглушена іконка теми */
.cover { background:
  radial-gradient(120% 120% at 100% 0%, color-mix(in srgb, var(--cc) 14%, transparent), transparent 65%),
  color-mix(in srgb, var(--cc) 5%, var(--bg)); }
.cover > svg { opacity: .75; }
.ph { position: absolute; inset: 0; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.credit { position: absolute; left: 8px; bottom: 8px; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 500; color: #FFFFFF; background: rgba(0,0,0,.55); }
.sponsor { font-size: 11px; font-weight: 600; color: var(--c-unmanned); }

.section-h { padding: 16px 16px 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--fg-2); }
.search { display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 10px; border-radius: 10px; background: var(--fill); color: var(--fg-2); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; color: var(--fg); outline: none; }

.empty { padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--fg-2); }
.empty strong { font-size: 20px; color: var(--fg); }

/* Grouped settings */
.group-h { padding: 18px 32px 6px; font-size: 13px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--fg-2); }
.group { margin: 0 16px; background: var(--surface); border-radius: 12px; overflow: hidden; }
.cell { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 6px 16px; }
.cell + .cell { border-top: 1px solid var(--sep); }
.cell-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 17px; }
.cell-label small { font-size: 12px; color: var(--fg-2); }
.group-f { padding: 6px 32px 0; font-size: 13px; line-height: 18px; color: var(--fg-2); }
.switch { position: relative; flex-shrink: 0; width: 51px; height: 31px; border: 0; border-radius: 16px; padding: 0; background: var(--sep); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill); }
.seg button { min-height: 32px; border: 0; border-radius: 7px; background: transparent; font-size: 14px; font-weight: 500; color: var(--fg); }
.seg button[aria-checked="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
:root[data-theme="dark"] .seg button[aria-checked="true"] { background: #3A3F33; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-checked="true"] { background: #3A3F33; } }
.cell.stack { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 16px 12px; }
.time { border: 0; background: var(--fill); border-radius: 8px; padding: 6px 10px; font-size: 17px; font-variant-numeric: tabular-nums; }
.notif { margin: 10px 16px 0; padding: 12px 14px; border-radius: 18px; background: var(--fill); display: flex; flex-direction: column; gap: 4px; }
.notif-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); }
.notif-ico { width: 22px; height: 22px; border-radius: 6px; background: #0E2234; color: #7CC46A; display: grid; place-items: center; }
.notif-top .when { margin-left: auto; }
.notif b { font-size: 15px; }
.notif p { margin: 0; font-size: 15px; line-height: 20px; }

/* Article card */
.detail { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; background: var(--bg); transform: translateX(0); transition: transform .28s ease; }
.detail.entering { transform: translateX(100%); }
.navbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0; border-bottom: 1px solid var(--sep); background: var(--bar); }
.icon-btn { min-width: 44px; height: 44px; border: 0; background: transparent; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 8px; font-size: 17px; }
.detail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.hero { --cc: var(--accent); position: relative; overflow: hidden; flex-shrink: 0; height: 210px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--cc); text-align: center; padding: 0 16px; }
.hero-cat { font-size: 17px; font-weight: 700; }
.hero-src { font-size: 13px; color: var(--fg-2); }
.detail h2 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 30px; font-weight: 700; text-wrap: balance; }
.byline { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--fg-2); }
.byline b { color: var(--fg); font-weight: 600; }
.summary { margin: 0; font-size: 17px; line-height: 25px; max-width: 65ch; }
.tr { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--fill); }
.tr small { font-size: 12px; font-weight: 600; color: var(--fg-2); }
.tr h3 { margin: 0; font-size: 18px; line-height: 24px; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border-radius: 14px; border: 0; font-size: 17px; font-weight: 600; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--accent); }
.foot { margin: 0; font-size: 13px; line-height: 18px; color: var(--fg-2); }

/* === CONFLICT MAP CSS START === */
/* Карта конфліктів: точкова мапа світу, маркери поверх неї (розмір — масштаб, пульсація — нове загострення). */
.cm { --cm-hot: var(--c-missiles); --cm-old: color-mix(in srgb, var(--c-missiles) 70%, var(--bg)); --cm-land: color-mix(in srgb, var(--fg) 24%, transparent); display: flex; flex-direction: column; gap: 12px; }
.cm-regions { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.cm-regions::-webkit-scrollbar { display: none; }
.cm-regions button { flex-shrink: 0; min-height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid transparent; background: var(--fill); font-size: 13px; font-weight: 600; color: var(--fg); }
.cm-regions button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.cm-stage { position: relative; overflow: hidden; border-radius: 16px; aspect-ratio: 1.3; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
  background: radial-gradient(130% 100% at 50% 0%, color-mix(in srgb, var(--accent) 6%, var(--surface, var(--bg))), var(--surface, var(--bg))); border: 1px solid var(--sep); }
.cm-stage.dragging { cursor: grabbing; }
.cm-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cm-land { fill: var(--cm-land); }
.cm-grid { fill: none; stroke: color-mix(in srgb, var(--fg) 7%, transparent); stroke-width: .25; vector-effect: non-scaling-stroke; }
.cm-stage stop { stop-color: var(--cm-hot); }
.cm-pins { position: absolute; inset: 0; pointer-events: none; }
.cm-pin { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; pointer-events: auto; border: 0; padding: 0; background: none; border-radius: 50%; }
.cm-pin i { position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); transform: translate(-50%, -50%); border-radius: 50%; background: var(--cm-old);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--bg) 85%, transparent), 0 1px 6px rgba(0,0,0,.25); transition: transform .2s; }
.cm-pin.l3 { --d: 20px; } .cm-pin.l2 { --d: 14px; } .cm-pin.l1 { --d: 9px; }
.cm-pin.hot i { background: var(--cm-hot); }
.cm-pin.hot b { position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border-radius: 50%; border: 2px solid var(--cm-hot); animation: cm-pulse 1.8s ease-out infinite; pointer-events: none; }
.cm-pin.hot b + b { animation-delay: .9s; }
.cm-pin:hover i, .cm-pin:focus-visible i { transform: translate(-50%, -50%) scale(1.18); }
.cm-pin.sel i { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--fg); }
@keyframes cm-pulse { from { transform: scale(1); opacity: .85; } to { transform: scale(3.1); opacity: 0; } }
.cm-tip { position: absolute; z-index: 2; max-width: 240px; padding: 8px 10px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 12px; line-height: 1.35; pointer-events: none; transform: translate(-50%, calc(-100% - 16px)); box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.cm-tip strong { display: block; font-size: 13px; }
.cm-zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: var(--surface, var(--bg)); border: 1px solid var(--sep); }
.cm-zoom button { width: 34px; height: 32px; border: 0; background: transparent; font-size: 18px; font-weight: 600; color: var(--fg); }
.cm-zoom button + button { border-top: 1px solid var(--sep); }
.cm-asof { position: absolute; left: 10px; bottom: 10px; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--fg-2); background: color-mix(in srgb, var(--bg) 80%, transparent); }
.cm-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12px; color: var(--fg-2); }
.cm-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cm-legend i { display: inline-block; border-radius: 50%; background: var(--cm-old); }
.cm-legend .hot { background: var(--cm-hot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cm-hot) 25%, transparent); }
.cm-card { position: relative; padding: 16px; border-radius: 16px; background: var(--surface, var(--bg)); border: 1px solid var(--sep); display: flex; flex-direction: column; gap: 8px; animation: cm-in .25s ease; }
@keyframes cm-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.cm-card h3 { margin: 0; padding-right: 36px; font-family: var(--font-display); font-size: 20px; line-height: 1.2; font-weight: 800; }
.cm-parties { font-size: 15px; font-weight: 600; }
.cm-badge { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; color: var(--fg-2); background: var(--fill); }
.cm-badge.hot { color: #FFFFFF; background: var(--cm-hot); }
.cm-facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 2px 0; font-size: 13px; }
.cm-facts dt { color: var(--fg-2); }
.cm-facts dd { margin: 0; font-weight: 600; }
.cm-card p { margin: 0; font-size: 14px; line-height: 1.5; }
.cm-card .cm-note { font-size: 12px; color: var(--fg-2); }
.cm-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); font-size: 16px; color: var(--fg); }
.cm-news { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; margin-top: 4px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 650; }
.cm-list h4 { margin: 8px 0 6px; font-size: 13px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; color: var(--fg-2); }
.cm-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 10px 2px; border: 0; border-top: 1px solid var(--sep); background: transparent; text-align: left; }
.cm-row .dot { justify-self: center; border-radius: 50%; background: var(--cm-old); }
.cm-row.hot .dot { background: var(--cm-hot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cm-hot) 22%, transparent); }
.cm-row b { display: block; font-size: 15px; font-weight: 650; }
.cm-row small { display: block; font-size: 12px; color: var(--fg-2); }
.cm-row em { font-style: normal; font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.cm-row.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.cm-src { font-size: 11px; line-height: 1.45; color: var(--fg-2); }
/* Широкий режим (веб): карта ліворуч, картка та список праворуч */
.cm.wide { display: grid; grid-template-rows: auto auto auto 1fr; grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "regions regions" "stage side" "legend side" "src side"; gap: 12px 28px; align-items: start; }
.cm.wide .cm-regions { grid-area: regions; }
.cm.wide .cm-stage { grid-area: stage; aspect-ratio: 1.9; }
.cm.wide .cm-legend { grid-area: legend; }
.cm.wide .cm-src { grid-area: src; }
.cm.wide .cm-side { grid-area: side; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 150px); overflow-y: auto; position: sticky; top: 130px; }
.cm:not(.wide) .cm-side { display: contents; }
@media (max-width: 1000px) {
  .cm.wide { display: flex; }
  .cm.wide .cm-side { display: contents; }
  .cm.wide .cm-stage { aspect-ratio: 1.5; }
}
@media (prefers-reduced-motion: reduce) { .cm-pin.hot b { animation: none; display: none; } .cm-card { animation: none; } }
/* === CONFLICT MAP CSS END === */
#map-root { padding: 4px 16px 28px; }
/* Заставка за заголовком «Сьогодні» */
.hdr.hdr-hero { position: relative; overflow: hidden; padding-bottom: 14px; }
.hdr.hdr-hero > * { position: relative; }
.hdr.hdr-hero > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; opacity: .9;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.9) 70%, rgba(0,0,0,.4)); mask-image: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.9) 70%, rgba(0,0,0,.4)); }
/* === INNOVATIONS CSS START === */
.iv { --s-dev: #6B6F66; --s-test: #A15C00; --s-prod: #1D5FBF; --s-service: #2F6B2B; display: flex; flex-direction: column; gap: 12px; }
:root[data-theme="dark"] .iv { --s-dev: #A1A1A8; --s-test: #FFA552; --s-prod: #6EA8FF; --s-service: #7CC46A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .iv { --s-dev: #A1A1A8; --s-test: #FFA552; --s-prod: #6EA8FF; --s-service: #7CC46A; } }
.iv-filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.iv-filters::-webkit-scrollbar { display: none; }

      t: 'Anduril awarded contract to expand US Army’s next-gen battlefield command system',
      s: 'The Army awarded Anduril a contract worth up to $1.8 billion over five years to move its Next Generation Command and Control software from testing into fielding. The initial $162.8 million funds work on the system’s common data foundation as it rolls out to I Corps in the Indo-Pacific.',
      tr: 'Anduril отримала контракт на розширення системи бойового управління нового покоління для армії США',
      sr: 'Армія США уклала з Anduril контракт вартістю до 1,8 млрд доларів на п’ять років, щоб перевести програмне забезпечення NGC2 від випробувань до розгортання у військах. Перші 162,8 млн доларів підуть на спільну базу даних системи, яку зараз впроваджують у I корпусі в Індо-Тихоокеанському регіоні.',
      link: 'https://www.defensenews.com/industry/techwatch/2026/10/13/anduril-awarded-contract-to-expand-us-armys-next-gen-battlefield-command-system/',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/6TJQA6QJFZBY5FB3E7UYRCHEKY.jpg?width=1200&auth=93fa97b1b3dfbd7d01ba7e94df9b8cc308c62a4301f7299fa451a84be5eb5150' },
    { id: 'n3', src: 'defensenews', day: 1, fresh: true, ago: '4 год тому', date: '13 жовтня 2026 р., 23:15', author: 'Daniel Terrill', cats: ['missiles', 'electronic', 'industry'],
      t: 'BAE Systems unveils new layered air-defense system',
      s: 'At the AUSA annual meeting, BAE Systems revealed two complementary air-defense systems aimed at countering missiles and drones: the Multi-Domain Artillery Cannon System and a High-Power Microwave. Both are meant to protect key installations and units in the field.',
      tr: 'BAE Systems представила нову ешелоновану систему ППО',
      sr: 'На щорічній виставці AUSA компанія BAE Systems показала дві взаємодоповнювальні системи ППО для протидії ракетам і дронам: багатодоменну артилерійську гарматну систему та потужну мікрохвильову установку. Обидві призначені для захисту ключових об’єктів і підрозділів у польових умовах.',
      link: 'https://www.defensenews.com/industry/techwatch/2026/10/13/bae-systems-unveils-new-layered-air-defense-system/',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/YYR7TTLIFVFZXPB2JHZ2GHB5YU.jpg?width=1200&auth=90364bf82c1141dbd9e87780465c61ec401efa46b34093c604c836f4401cd953' },
    { id: 'n4', src: 'defenseone', day: 1, fresh: true, ago: '5 год тому', date: '13 жовтня 2026 р., 22:52', author: 'Meghann Myers', cats: ['missiles', 'industry'],
      t: 'Army re-evaluating munitions procurement goals as Iran war continues',
      s: 'Army officials said the service’s procurement goals for critical munitions may be shifting, with more Patriot interceptors, especially PAC-3 MSE, a top priority. The Army is also looking at buying PAC-2 GEM-T missiles, though how far these programs scale depends on funding from Congress.',
      tr: 'Армія США переглядає цілі закупівель боєприпасів на тлі війни з Іраном',
      sr: 'Представники армії США заявили, що цілі закупівель критичних боєприпасів можуть змінитися, а головним пріоритетом стають додаткові ракети-перехоплювачі Patriot, насамперед PAC-3 MSE. Армія також розглядає закупівлю ракет PAC-2 GEM-T, але масштаб цих програм залежатиме від фінансування Конгресу.',
      link: 'https://www.defenseone.com/defense-systems/2026/10/army-munitions-procurement-iran/416567/',
      img: 'https://cdn.defenseone.com/media/img/cd/2026/10/13/IMG_2632/open-graph.jpg' },
    { id: 'n5', src: 'twz', day: 1, fresh: true, ago: '5 год тому', date: '13 жовтня 2026 р., 22:38', author: 'Joseph Trevithick, Howard Altman', cats: ['land', 'industry'],
      t: 'Sig Sauer’s M250 Machine Gun Gets Shorter And Lighter After Army Feedback',
      s: 'Following Army feedback, Sig Sauer has made an improved M250A1 version of its 6.8x51mm light machine gun with a 13-inch barrel, a revised buttstock and reliability upgrades. The Army has not yet formally adopted this configuration.',
      tr: 'Кулемет Sig Sauer M250 став коротшим і легшим після відгуків армії США',
      sr: 'З урахуванням відгуків армії Sig Sauer створила вдосконалену версію M250A1 свого 6,8-мм ручного кулемета з 13-дюймовим стволом, новим прикладом і низкою покращень надійності. Армія США поки офіційно не ухвалила цю конфігурацію.',
      link: 'https://twz.com/land/sig-sauers-m250-machine-gun-gets-shorter-and-lighter-after-army-feedback',
      img: 'https://www.twz.com/wp-content/uploads/2026/10/new-m250a1-machine-gun-us-army.jpg?w=1200' },
    { id: 'n6', src: 'defensenews', day: 1, fresh: true, ago: '5 год тому', date: '13 жовтня 2026 р., 22:15', author: 'Natalie Oliverio', cats: ['unmanned', 'land', 'ai'],
      t: 'How autonomous weapons are changing the way brigades fight',
      s: 'The Army tested how unmanned systems could help troops breach obstacles at Fort Bragg and is now moving those efforts into acquisition and new organizational structures. Its own research suggests turning these ambitions into reliable capability, especially with degraded communications, will be difficult.',
      tr: 'Як автономна зброя змінює бойові дії бригад',
      sr: 'Армія США перевірила у Форт-Брегу, як безекіпажні системи можуть допомагати бійцям долати загородження, і тепер переводить ці напрацювання в закупівлі та нові організаційні структури. Власні дослідження армії свідчать, що перетворити ці амбіції на надійну бойову спроможність, особливо в умовах порушеного зв’язку, буде непросто.',
      link: 'https://www.defensenews.com/industry/techwatch/2026/10/13/how-autonomous-weapons-are-changing-the-way-brigades-fight/',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/ZKZ5C2VWLZHHXCDX6Y3D2RWZ6U.jpg?width=1200&auth=0197cb5b5aa5591a96efcd0bdc57a38b5424ef56fe958e05269b70d7f816b821' },
    { id: 'n7', src: 'defensenews', day: 1, fresh: true, ago: '6 год тому', date: '13 жовтня 2026 р., 21:45', author: 'Daniel Terrill', cats: ['ai', 'land', 'industry'],
      t: 'Startup wants US soldiers to command AI agents through its smart glasses',
      s: 'Rivet, one of two Army contractors building battlefield awareness gear, has raised $55 million and delivered 70 prototypes. Its CEO wants smart glasses to eventually let soldiers direct AI agents that operate drones and robots.',
      tr: 'Стартап хоче, щоб американські солдати керували ШІ-агентами через його розумні окуляри',
      sr: 'Rivet, один із двох підрядників армії США, що створюють засоби ситуаційної обізнаності для бійців, залучив 55 млн доларів і поставив 70 прототипів. Його CEO прагне, щоб окуляри згодом дозволяли солдатам керувати ШІ-агентами, які управляють дронами й роботами.',
      link: 'https://www.defensenews.com/industry/techwatch/2026/10/13/startup-wants-us-soldiers-to-command-ai-agents-through-its-smart-glasses/',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/CMWVYGTMHFALHD4NCVNWYZ77ME.jpg?width=1200&auth=5cded9f8a467d7b2aabba8452ab07e18b0d3e73476196a1072592a1fed693935' },
    { id: 'n8', src: 'twz', day: 1, fresh: true, ago: '6 год тому', date: '13 жовтня 2026 р., 21:35', author: 'Thomas Newdick', cats: ['missiles', 'land', 'industry'],
      t: 'Bradley’s Old TOW Launchers Get New Teeth With Spike Missile Adapter',
      s: 'Rafael USA and Leonardo DRS unveiled an adapter that lets vehicles with older TOW launchers fire the Spike LR2 anti-armor missile. It builds on a 2021 demonstration with a more mature design for existing platforms.',
      tr: 'Старі пускові установки TOW на Bradley отримають нові «зуби» завдяки адаптеру для ракет Spike',
      sr: 'Rafael USA і Leonardo DRS представили адаптер, що дозволяє машинам зі старими пусковими TOW запускати протитанкові ракети Spike LR2. Розробка спирається на демонстрацію 2021 року й тепер має доопрацьовану конструкцію для наявних платформ.',
      link: 'https://www.twz.com/land/bradleys-old-tow-launchers-get-new-teeth-with-spike-missile-adapter',
      img: 'https://www.twz.com/wp-content/uploads/2026/10/SPIKE-Bradley-TOW.jpg?w=1200' },
    { id: 'n9', src: 'twz', day: 1, fresh: true, ago: '7 год тому', date: '13 жовтня 2026 р., 20:47', author: 'Thomas Newdick', cats: ['unmanned', 'electronic', 'industry'],
      t: 'Specter Jet-Powered Drone Aims At Low Cost, Multi-Mission, Single Use',
      s: 'AEVEX, maker of the Phoenix Ghost drones sent to Ukraine, unveiled its turbojet-powered Specter at AUSA. It is designed for one-way strikes but can also carry cameras or jamming payloads.',
      tr: 'Реактивний дрон Specter: дешевий, багатоцільовий, одноразовий',
      sr: 'AEVEX, виробник дронів Phoenix Ghost для України, представила на AUSA турбореактивний Specter. Він призначений для ударів в один бік, але може нести камери чи апаратуру РЕБ.',
      link: 'https://www.twz.com/news-features/specter-jet-powered-drone-aims-at-low-cost-multi-mission-single-use',
      img: 'https://www.twz.com/wp-content/uploads/2026/10/AEVEX-Drone.jpg?w=1200' },
    { id: 'n10', src: 'defensenews', day: 1, fresh: true, ago: '7 год тому', date: '13 жовтня 2026 р., 20:45', author: 'Leandra Bernstein', cats: ['electronic', 'unmanned', 'land'],
      t: 'US Army targets 2028 for first high-energy laser counter-drone weapons',
      s: 'The first weapon chosen for the Army’s Enduring High Energy Laser program could be ready for counter-drone operations by early 2028. AeroVironment won a $464.8 million contract in September for its LOCUST X3 laser.',
      tr: 'Армія США планує перші бойові лазери проти дронів на 2028 рік',
      sr: 'Перша зброя програми Enduring High Energy Laser може бути готова до протидії дронам на початку 2028 року. У вересні AeroVironment отримала контракт на 464,8 млн доларів на лазер LOCUST X3.',
      link: 'https://www.defensenews.com/industry/techwatch/2026/10/13/us-army-targets-2028-for-first-high-energy-laser-counter-drone-weapons/',

    { id: 'n11', src: 'defensenews', day: 1, fresh: true, ago: '8 год тому', date: '13 жовтня 2026 р., 20:02', author: 'Sebastian Sprenger', cats: ['missiles', 'industry'],
      t: 'Lockheed eyes fresh PAC-3 interceptor production options for Ukraine, Europe',
      s: 'Lockheed Martin is exploring partnerships with European industry to build PAC-3 Patriot interceptors, which could also serve Ukraine’s needs. Kyiv says Washington promised it a licence for domestic production, though the US has not chosen between PAC-3 and PAC-2.',
      tr: 'Lockheed шукає нові варіанти виробництва ракет PAC-3 для України та Європи',
      sr: 'Lockheed Martin обговорює з європейською промисловістю випуск перехоплювачів PAC-3, що могло б закрити й потреби України. У Києві кажуть, що США пообіцяли ліцензію на власне виробництво, але вибір між PAC-3 і PAC-2 ще не зроблено.',
      link: 'https://www.defensenews.com/industry/2026/10/13/lockheed-eyes-fresh-pac-3-interceptor-production-options-for-ukraine-europe/',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/TPRIF5KCW5ASBF2G32F6YG7UBU.jpg?width=1200&auth=8b53605fa3b35c57bb16db21ffa2abd5bf2f6b193e5adc823ed093f0100c2d0c' },
    { id: 'n12', src: 'defensenews', day: 1, fresh: true, ago: '8 год тому', date: '13 жовтня 2026 р., 19:15', author: 'Michael Scanlon', cats: ['unmanned', 'ai'],
      t: 'US Army to stand up command for unmanned and autonomous warfare',
      s: 'Days after the Pentagon announced a four-star autonomous warfare command, the Army ordered its own Futures and Autonomous Systems Command. The memo does not yet say who will lead it, where it will sit or when it will form.',
      tr: 'Армія США створить командування безекіпажної та автономної війни',
      sr: 'Слідом за Пентагоном, який оголосив про чотиризіркове командування автономної війни, армія наказала створити власне Futures and Autonomous Systems Command. Хто його очолить, де і коли — поки не визначено.',
      link: 'https://www.defensenews.com/news/your-military/2026/10/13/us-army-to-stand-up-command-for-unmanned-and-autonomous-warfare/',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/TVT3DSUTGFHTFMFJ6DXZRAAU7I.jpg?width=1200&auth=2f84fe1fee5782a12542caa61593299de5cf01a777a1bad0e08bf5369a3172a4' },
    { id: 'n13', src: 'defensenews', day: 1, fresh: true, ago: '9 год тому', date: '13 жовтня 2026 р., 18:45', author: 'Riley Ceder', cats: ['land', 'industry'],
      t: 'The Lynx XM30 is making its case to be the US Army’s Bradley replacement',
      s: 'American Rheinmetall delivered its Lynx XM30 prototype to the Army in September, and soldiers are now getting hands-on time with it. The vehicle competes with General Dynamics Land Systems’ Wolf XM30, and Rheinmetall expects Army test feedback to shape its updated design.',
      tr: 'Lynx XM30 доводить, що може замінити Bradley в армії США',
      sr: 'American Rheinmetall у вересні передала армії США прототип Lynx XM30, і військові вже випробовують його на практиці. Машина змагається з Wolf XM30 від General Dynamics Land Systems, а Rheinmetall розраховує, що відгуки армії за результатами випробувань вплинуть на оновлену конструкцію.',
      link: 'https://www.defensenews.com/industry/techwatch/2026/10/13/the-lynx-xm30-is-making-its-case-to-be-the-us-armys-bradley-replacement/',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/FCLIA4J6UFGXLFUDZGHZZJ2DUI.png?width=1200&auth=3e75143a2751140d059c60c974e80ae3ccd185220a34bdae2cfc4440848adf09' },
    { id: 'n14', src: 'militarnyi', day: 1, fresh: true, ago: '10 год тому', date: '13 жовтня 2026 р., 17:35', author: 'Ilya Zalutsky', cats: ['space', 'industry'],
      t: 'Czechoslovak Group Acquires Stake in Canadian Space Company MDA Space',
      s: 'Czech defense group CSG has bought a 9.5% stake in Canadian satellite maker MDA Space. The deal is meant to help CSG build its own space technology division focused on military applications.',
      tr: 'Czechoslovak Group придбала частку в канадській космічній компанії MDA Space',
      sr: 'Чеський оборонний холдинг CSG купив 9,5% акцій канадського виробника супутників MDA Space. Угода має допомогти CSG створити власний космічний підрозділ із фокусом на військових застосуваннях.',
      link: 'https://militarnyi.com/en/news/czechoslovak-group-canada-company-mda-space/',

    { id: 'n15', src: 'militarnyi', day: 1, fresh: true, ago: '11 год тому', date: '13 жовтня 2026 р., 16:52', author: 'Vladyslav Khomenko', cats: ['unmanned', 'air', 'industry'],
      t: 'Greece Will Become a Hub for Repair, Maintenance, and Training for X-BAT Drones',
      s: 'Shield AI and Greek holding GEK TERNA agreed to set up a Greek base for the X-BAT unmanned fighter, covering local parts production, training, repair centers and ground infrastructure. Initial X-BAT flight tests are planned for the end of the year.',
      tr: 'Греція стане центром ремонту, обслуговування та навчання для дронів X-BAT',
      sr: 'Shield AI і грецький холдинг GEK TERNA домовилися створити в Греції базу для безпілотного винищувача X-BAT: місцеве виробництво компонентів, навчальні та ремонтні центри й наземну інфраструктуру. Перші льотні випробування X-BAT заплановано на кінець року.',
      link: 'https://militarnyi.com/en/news/greece-hub-repair-maintenance-x-bat-drones/',
      img: 'https://militarnyi.com/wp-content/uploads/2026/10/87768f8838069b0d.jpeg' },
    { id: 'n16', src: 'defensenews', day: 1, fresh: true, ago: '11 год тому', date: '13 жовтня 2026 р., 16:47', author: 'Hope Hodge Seck', cats: ['industry', 'land'],
      t: 'US Army aspires to create Indo-Pacific manufacturing hub in Korea',
      s: 'The U.S. Army is investing in 3D printing and subtractive manufacturing in South Korea to produce spare parts for local forces and troops across the Pacific. Officials say local production can shorten delays and cut costs compared with long-distance supply.',
      tr: 'Армія США хоче створити в Кореї виробничий хаб для Індо-Тихоокеанського регіону',
      sr: 'Армія США інвестує в 3D-друк і механічну обробку в Південній Кореї, щоб виготовляти запчастини для місцевих сил і військ по всьому Тихоокеанському регіону. За словами посадовців, місцеве виробництво скорочує затримки й витрати порівняно з постачанням здалеку.',
      link: 'https://www.defensenews.com/global/asia-pacific/2026/10/13/us-army-aspires-to-create-indo-pacific-manufacturing-hub-in-korea/',

    { id: 'n17', src: 'twz', day: 1, fresh: true, ago: '12 год тому', date: '13 жовтня 2026 р., 15:19', author: 'Joseph Trevithick', cats: ['unmanned', 'electronic', 'land'],
      t: 'Drones Are Creating New Opportunities For The U.S. Army To Deceive Its Enemies',
      s: 'US Army units in Europe have spent over a year testing counter-drone systems and tactics under Project Flytrap. At AUSA, the 2nd Cavalry Regiment described how uncrewed systems open new ways to deceive an opponent.',
      tr: 'Дрони відкривають армії США нові можливості для введення ворога в оману',
      sr: 'Підрозділи армії США в Європі понад рік випробовують засоби й тактику протидії дронам у межах Project Flytrap. На AUSA 2-й кавалерійський полк розповів, як безекіпажні системи допомагають обманювати противника.',
      link: 'https://www.twz.com/news-features/drones-are-creating-new-opportunities-for-the-u-s-army-to-deceive-its-enemies',
      img: 'https://www.twz.com/wp-content/uploads/2026/10/army-drone-deception-tactics.jpg?w=1200' },
    { id: 'n18', src: 'defensenews', day: 1, fresh: true, ago: '13 год тому', date: '13 жовтня 2026 р., 14:53', author: 'Hope Hodge Seck', cats: ['unmanned', 'land', 'industry'],
      t: 'Drone carrying M250 machine gun completes firing test',
      s: 'Sig Sauer and Israel Aerospace Industries tested the Fire Storm 250, a heavy quadcopter armed with the M250 light machine gun. The drone hovered over a simulated battlefield, found targets with its camera and fired single shots and semi-automatic bursts.',
      tr: 'Дрон із кулеметом M250 пройшов вогневі випробування',
      sr: 'Sig Sauer та Israel Aerospace Industries випробували важкий квадрокоптер Fire Storm 250 з кулеметом M250. Дрон зависав над умовним полем бою, знаходив цілі камерою й вів одиночний та напівавтоматичний вогонь.',
      link: 'https://www.defensenews.com/industry/techwatch/2026/10/13/drone-carrying-m250-machine-gun-completes-firing-test/',

    { id: 'n19', src: 'navalnews', day: 1, fresh: true, ago: '13 год тому', date: '13 жовтня 2026 р., 14:39', author: '', cats: ['naval', 'industry'],
      t: 'Sweden Formalizes Interim Submarine Training and Södermanland Lease for Poland',

      blurb: 'Родина безекіпажних катерів. Magura V5 уразили низку кораблів Чорноморського флоту РФ, а V7 несе ракети AIM-9 Sidewinder для морської ППО: у травні 2025 року морський дрон Magura вперше у світі збив винищувач.',
      blurb_en: 'A family of uncrewed surface vessels. Magura V5 drones have struck a number of Russian Black Sea Fleet ships, while the V7 carries AIM-9 Sidewinder missiles for naval air defence: in May 2025 a Magura naval drone shot down a fighter jet, a world first.',
      specs: [['Дальність (V7)', '870 км'], ['Корисне навантаження (V7)', 'до 650 кг']],
      specs_en: [['Range (V7)', '870 km'], ['Payload (V7)', 'up to 650 kg']],

      name_en: 'Protector UGV', maker_en: 'Ukrainian Armor',

      blurb: 'Важкий наземний роботизований комплекс для логістики, евакуації поранених і бойових завдань. Кодифікований Міноборони України у 2025 році.',
      blurb_en: 'A heavy uncrewed ground vehicle for logistics, casualty evacuation and combat tasks. Codified by the Ministry of Defence of Ukraine in 2025.',

    { id: 'ad-ironbeam', name: 'Iron Beam', maker: 'Rafael Advanced Defense Systems та Elbit Systems', country: 'Ізраїль', type: 'missiles', stage: 'service', q: 'Iron Beam',
      maker_en: 'Rafael Advanced Defense Systems and Elbit Systems',
      img: 'https://static-cdn.toi-media.com/www/uploads/2025/09/D06_20250902024347_1.mp4.00_05_55_08.Still001.jpg',
      blurb: 'Наземний бойовий лазер високої потужності для перехоплення дронів, ракет, артилерійських снарядів і мін. Систему оголосили боєготовою у вересні 2025 року, а 28 грудня 2025 року передали ЦАХАЛ. Вона має доповнити Iron Dome і різко знизити вартість одного перехоплення. Під час війни з Іраном 2026 року лазер застосовували обмежено: за даними ВПС, для відчутного ефекту потрібно 14 батарей.',
      blurb_en: 'A high-power ground-based combat laser for intercepting drones, rockets, artillery shells and mortar bombs. The system was declared operational in September 2025 and handed over to the IDF on 28 December 2025. It is meant to complement Iron Dome and sharply cut the cost per interception. During the 2026 war with Iran the laser saw limited use: according to the Air Force, 14 batteries are needed for a noticeable effect.',
      specs: [['Клас потужності', '100 кВт'], ['Дальність ураження', 'від сотень метрів до кількох кілометрів'], ['Передача ЦАХАЛ', '28 грудня 2025']],
      specs_en: [['Power class', '100 kW'], ['Engagement range', 'from hundreds of metres to several kilometres'], ['Handover to the IDF', '28 December 2025']],
      links: [['Джерело: The Times of Israel', 'https://www.timesofisrael.com/laser-based-iron-beam-interception-system-declared-operational/'], ['Джерело: The Jerusalem Post', 'https://www.jpost.com/israel-news/defense-news/article-894838']] },
    { id: 'ad-dragonfire', name: 'DragonFire', maker: 'MBDA UK, Leonardo UK та QinetiQ', country: 'Велика Британія', type: 'missiles', stage: 'prod', q: 'DragonFire',
      maker_en: 'MBDA UK, Leonardo UK and QinetiQ',
      img: 'https://ukdj.ams3.digitaloceanspaces.com/2024/01/dragonfire.jpg',
      blurb: 'Британська лазерна зброя спрямованої енергії для протидії дронам і ракетам. Систему ставитимуть на есмінці Type 45 Королівського флоту, перші кораблі мають отримати її у 2027 році. Один постріл коштує близько £10, тож DragonFire вважають дешевою альтернативою зенітним ракетам.',
      blurb_en: 'A British directed-energy laser weapon for countering drones and missiles. The system will be fitted to the Royal Navy’s Type 45 destroyers, with the first ships due to receive it in 2027. A single shot costs about £10, so DragonFire is seen as a cheap alternative to surface-to-air missiles.',
      specs: [['Клас потужності', '≈50 кВт'], ['Вартість пострілу', '≈£10 (лише електроенергія)'], ['Контракт на виробництво', '£316 млн (MBDA)']],
      specs_en: [['Power class', '≈50 kW'], ['Cost per shot', '≈£10 (electricity only)'], ['Production contract', '£316 million (MBDA)']],
      links: [['Джерело: UK Defence Journal', 'https://ukdefencejournal.org.uk/qinetiq-secures-67m-role-in-royal-navy-laser-weapon-effort/'], ['Джерело: Army Recognition', 'https://www.armyrecognition.com/news/navy-news/2026/uk-confirms-dragonfire-laser-weapon-deployment-on-type-45-air-defense-destroyers-by-2027']] },
    { id: 'ad-arrow4', name: 'Arrow 4', maker: 'Israel Aerospace Industries (IAI) та Агентство ПРО США (MDA)', country: 'Ізраїль', type: 'missiles', stage: 'test', q: 'Arrow 4',
      maker_en: 'Israel Aerospace Industries (IAI) and the US Missile Defense Agency (MDA)',
      img: 'https://militarnyi.com/wp-content/uploads/2025/05/Proyektne-zobrazhennya-rakety-kompleksu-Arrow-4.jpg',
      blurb: 'Перехоплювач нового покоління для верхнього ешелону ізраїльської протиракетної оборони. Він має замінити Arrow 2 і Arrow 3 та протидіяти маневрувальним і гіперзвуковим цілям. У лютому 2026 року IAI почала льотні випробування, а розгортання очікують у найближчі місяці. Систему також планує придбати Бундесвер.',
      blurb_en: 'A next-generation interceptor for the upper tier of Israel’s missile defence. It is to replace Arrow 2 and Arrow 3 and counter manoeuvring and hypersonic targets. IAI began flight tests in February 2026, and deployment is expected in the coming months. The Bundeswehr also plans to acquire the system.',
      specs: [['Призначення', 'верхній ешелон ПРО: маневрувальні та гіперзвукові цілі'], ['Льотні випробування', 'з лютого 2026'], ['Розробка', 'спільно з США']],
      specs_en: [['Role', 'upper-tier missile defence: manoeuvring and hypersonic targets'], ['Flight tests', 'since February 2026'], ['Development', 'jointly with the US']],
      links: [['Джерело: Militarnyi', 'https://militarnyi.com/en/news/iai-begins-flight-tests-of-arrow-4/'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/08/10/israel-arrow-missile-defense-test/']] },
    { id: 'ad-ltamds', name: 'LTAMDS', maker: 'Raytheon (RTX)', country: 'США', type: 'electronic', stage: 'prod', q: 'LTAMDS',
      img: 'https://prd-sc102-cdn.rtx.com/raytheon/-/media/ray/rmd/what-we-do/missile-defense/air-and-missile-defense-systems/ghosteye/2020-01/images/ltamds_hero_lg.jpg?rev=00e654691b9e43618ef4977dbbc73aac&rid=b07712ad28b94b93a524d8bd29ca9d8d',
      blurb: 'Радар нижнього ешелону ППО/ПРО, що замінює однопанельну станцію AN/MPQ-65 у комплексах Patriot. Три АФАР дають круговий огляд, а радар розрахований зокрема на гіперзвукові загрози. Армія США фінансує вже другий рік серійного виробництва, а Польща обрала LTAMDS для модернізації своїх Patriot.',
      blurb_en: 'A lower-tier air and missile defence radar replacing the single-face AN/MPQ-65 radar in Patriot systems. Three AESA arrays provide all-round coverage, and the radar is designed to handle threats including hypersonic ones. The US Army is funding a second year of full-rate production, and Poland has chosen LTAMDS to upgrade its Patriots.',
      specs: [['Антенні полотна', '3 АФАР, огляд 360°'], ['Потужність основного полотна', 'понад удвічі більша, ніж у радара Patriot'], ['Контракт на 2-й рік виробництва', '$1,03 млрд (січень 2026)']],
      specs_en: [['Antenna arrays', '3 AESA, 360° coverage'], ['Primary array power', 'more than twice that of the Patriot radar'], ['Production year 2 contract', '$1.03 billion (January 2026)']],
      links: [['Сайт виробника', 'https://www.rtx.com/raytheon/what-we-do/integrated-air-and-missile-defense/ltamds'], ['Джерело: GovCon Wire', 'https://www.govconwire.com/articles/raytheon-army-ltamds-contract'], ['Джерело: Defence Blog', 'https://defence-blog.com/u-s-army-awards-raytheon-904m-deal-to-expand-ltamds-radar-production/']] },
    { id: 'ad-gpi', name: 'Glide Phase Interceptor (GPI)', maker: 'Northrop Grumman', country: 'США', type: 'missiles', stage: 'dev', q: 'Glide Phase Interceptor',
      img: 'https://thedefensepost.com/wp-content/uploads/2024/09/NorthropGrummantoProduceFirstHypersonicGlidePhaseInterceptor.jpg',
      blurb: 'Морський перехоплювач для ураження гіперзвукових планерних блоків на ділянці планування. Запускатиметься з есмінців Aegis і комплексів Aegis Ashore через стандартну вертикальну пускову установку. Розробкою керує Агентство ПРО США, а Японія відповідає за ракетні двигуни. У квітні 2026 року програму прискорили.',
      blurb_en: 'A sea-based interceptor for destroying hypersonic glide vehicles in their glide phase. It will be launched from Aegis destroyers and Aegis Ashore sites via the standard vertical launch system. Development is led by the US Missile Defense Agency, with Japan responsible for the rocket motors. The programme was accelerated in April 2026.',
      specs: [['Вартість контракту', '$1,31 млрд'], ['Початкова готовність', 'до кінця 2029 р., щонайменше 12 ракет'], ['Носій', 'есмінці Aegis та Aegis Ashore']],
      specs_en: [['Contract value', '$1.31 billion'], ['Initial capability', 'by end of 2029, at least 12 missiles'], ['Platform', 'Aegis destroyers and Aegis Ashore']],
      links: [['Джерело: The Defense Post', 'https://thedefensepost.com/2026/04/15/glide-phase-interceptor/'], ['Джерело: Army Recognition', 'https://www.armyrecognition.com/news/aerospace-news/2026/u-s-speeds-up-1-3b-glide-phase-interceptor-for-early-hypersonic-missile-intercept-capability']] },
    { id: 'ad-ifpc', name: 'IFPC Inc 2 Enduring Shield', maker: 'Dynetics (Leidos) та RTX', country: 'США', type: 'missiles', stage: 'prod', q: 'Enduring Shield',
      maker_en: 'Dynetics (Leidos) and RTX',
      img: 'https://thedefensepost.com/wp-content/uploads/2023/01/dyn-banner-0e971df36e.jpg',
      blurb: 'Мобільна система ППО середнього ешелону армії США для захисту від крилатих ракет, дронів і реактивних снарядів. Пускова установка Enduring Shield зараз використовує наземну версію AIM-9X. У квітні 2026 року армія видала виробничий контракт. У вересні 2026 року у фінал конкурсу на другий, потужніший перехоплювач вийшли Lockheed Martin і команда Boeing та Anduril.',
      blurb_en: 'A mobile US Army medium-tier air defence system for protection against cruise missiles, drones and rockets. The Enduring Shield launcher currently uses a ground-launched version of the AIM-9X. The Army awarded a production contract in April 2026. In September 2026 Lockheed Martin and a Boeing and Anduril team reached the final of the competition for a second, more capable interceptor.',
      specs: [['Перехоплювач', 'AIM-9X Sidewinder'], ['Виробничий контракт', '$617 млн (квітень 2026)'], ['Склад взводу', '4 пускові установки']],
      specs_en: [['Interceptor', 'AIM-9X Sidewinder'], ['Production contract', '$617 million (April 2026)'], ['Platoon composition', '4 launchers']],
      links: [['Джерело: The Defense Post', 'https://thedefensepost.com/2026/04/16/dynetics-ifpc-air-defense/amp/'], ['Джерело: Breaking Defense', 'https://breakingdefense.com/2026/09/army-selects-lockheed-boeing-anduril-team-for-next-phase-in-ifpc-inc-2-competition/']] },
    { id: 'ad-samptng', name: 'SAMP/T NG', maker: 'Eurosam (MBDA та Thales)', country: 'Франція та Італія', type: 'missiles', stage: 'prod', q: 'SAMP/T',
      maker_en: 'Eurosam (MBDA and Thales)',
      img: 'https://www.defencetoday.com/wp-content/uploads/2026/03/samp-t_mbda_adrien-daste.jpg',
      blurb: 'Європейський зенітний ракетний комплекс нового покоління з радаром Ground Fire 300 і ракетами Aster 30 B1NT. У березні 2026 року Франція отримала перший комплекс для оцінки перед прийняттям на озброєння. У 2026 році SAMP/T NG обрала Данія, а Україна замовила чотири комплекси.',
      blurb_en: 'A next-generation European surface-to-air missile system with the Ground Fire 300 radar and Aster 30 B1NT missiles. In March 2026 France received the first system for evaluation ahead of entry into service. In 2026 Denmark selected SAMP/T NG, and Ukraine ordered four systems.',
      specs: [['Радар', 'Thales Ground Fire 300, виявлення понад 350 км'], ['Ракета', 'Aster 30 Block 1 NT'], ['Дальність перехоплення літаків', '150 км']],
      specs_en: [['Radar', 'Thales Ground Fire 300, detection over 350 km'], ['Missile', 'Aster 30 Block 1 NT'], ['Aircraft intercept range', '150 km']],
      links: [['Сайт виробника', 'https://eurosam.com/project/samp-t-ng/'], ['Джерело: Defence Today', 'https://www.defencetoday.com/land/weapons/france-takes-delivery-of-first-samp-t-ng-air-defence-system/'], ['Джерело: Militarnyi', 'https://militarnyi.com/en/news/zelensky-ukraine-to-receive-samp-t-air-defense-system-and-radars-from-france-this-fall/']] },
    { id: 'ad-iristslm', name: 'IRIS-T SLM', maker: 'Diehl Defence', country: 'Німеччина', type: 'missiles', stage: 'service', upd: '2026-10-02', q: 'IRIS-T',
      img: 'https://esut.de/wp-content/uploads/2026/10/F125-NewLauncher_SLMPiP-2026-_Diehl.jpg',
      blurb: 'Зенітний ракетний комплекс середньої дальності, який стрімко поширюється в Європі й добре проявив себе в Україні. У жовтні 2026 року BAAINBw і Diehl домовилися адаптувати IRIS-T SLM для фрегатів F125. Проєкт 23 вересня схвалив бюджетний комітет Бундестагу.',
      blurb_en: 'A medium-range surface-to-air missile system that is spreading rapidly across Europe and has performed well in Ukraine. In October 2026 BAAINBw and Diehl agreed to adapt IRIS-T SLM for F125 frigates. The project was approved by the Bundestag budget committee on 23 September.',
      specs: [['Дальність', 'до 60 км'], ['Висота ураження', 'до 20 км'], ['Рамкова угода ФРН', 'понад 1200 ракет IRIS-T до 2030 р.']],
      specs_en: [['Range', 'up to 60 km'], ['Engagement altitude', 'up to 20 km'], ['German framework agreement', 'over 1,200 IRIS-T missiles by 2030']],
      links: [['Джерело: ESUT', 'https://esut.de/2026/10/meldungen/see/75495/diehl-defence-iris-t-slm/'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/02/09/germany-iris-t-missile/amp/']] },
    { id: 'ad-skyranger30', name: 'Skyranger 30', maker: 'Rheinmetall', country: 'Німеччина', type: 'missiles', stage: 'prod', q: 'Skyranger',
      img: 'https://thedefensepost.com/wp-content/uploads/2026/08/Skyranger_30_ACSV_-_Netherlands.jpg',
      blurb: 'Мобільна баштова система ППО ближньої дії з 30-мм гарматою, яка стріляє програмованими боєприпасами. Розрахована передусім на боротьбу з дронами. Її замовили або обрали Німеччина (на Boxer), Австрія, Угорщина, Данія й Нідерланди, а Бельгія планує купити 20 систем. Серійні поставки Бундесверу затрималися щонайменше до 2027 року.',
      blurb_en: 'A mobile turreted short-range air defence system with a 30 mm cannon firing programmable ammunition. Designed primarily to counter drones. It has been ordered or selected by Germany (on Boxer), Austria, Hungary, Denmark and the Netherlands, and Belgium plans to buy 20 systems. Series deliveries to the Bundeswehr have been delayed until at least 2027.',
      specs: [['Гармата', '30 мм KCE-ABM, до 1250 пострілів/хв'], ['Дальність гармати', 'до 3 км'], ['Радар', 'Hensoldt Spexer 2000M']],
      specs_en: [['Cannon', '30 mm KCE-ABM, up to 1,250 rounds/min'], ['Cannon range', 'up to 3 km'], ['Radar', 'Hensoldt Spexer 2000M']],
      links: [['Сайт виробника', 'https://www.rheinmetall.com/en/media/news-watch/news/2024/02/2024-02-27-bundeswehr-ordered-skyranger-30-mobile-air-defence-system'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/08/10/skyranger-30-guide/'], ['Джерело: Army Recognition', 'https://www.armyrecognition.com/news/army-news/2026/skyranger-30-air-defense-system-belgium']] },
    { id: 'ad-leonidas', name: 'Leonidas HPM', maker: 'Epirus', country: 'США', type: 'missiles', stage: 'prod', q: 'Leonidas',
      img: 'https://www.twz.com/wp-content/uploads/2025/07/Epirus-HPM-Leonidas.jpg?w=1200',
      blurb: 'Твердотільна надпотужна мікрохвильова зброя на нітриді галію, яка виводить з ладу цілі рої дронів одним імпульсом. На демонстрації 2025 року система знешкодила всі 61 дрон, зокрема рій із 49 апаратів. Армія США закупила прототипи другого покоління за програмою IFPC-HPM. У серпні 2026 року Корпус морської піхоти замовив автомобільну версію HAVOC.',
      blurb_en: 'A solid-state gallium nitride high-power microwave weapon that disables entire drone swarms with a single pulse. In a 2025 demonstration the system defeated all 61 drones, including a swarm of 49. The US Army has bought second-generation prototypes under the IFPC-HPM programme. In August 2026 the Marine Corps ordered the HAVOC vehicle-mounted version.',
      specs: [['Демонстрація 2025', '61 з 61 дрона, рій із 49 одним імпульсом'], ['Контракт армії США', '$43,5 млн за 2 системи Gen II'], ['Gen II порівняно з Gen I', 'дальність більш ніж удвічі більша, потужність +30%']],
      specs_en: [['2025 demonstration', '61 of 61 drones, a swarm of 49 with one pulse'], ['US Army contract', '$43.5 million for 2 Gen II systems'], ['Gen II vs Gen I', 'more than double the range, +30% power']],
      links: [['Сайт виробника', 'https://www.epirusinc.com/platforms/hpm-leonidas'], ['Джерело: The War Zone', 'https://www.twz.com/land/army-puts-50m-bet-on-next-gen-leonidas-high-power-microwave-counter-drone-tech'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/08/11/us-marines-microwave-weapon/']] },
    { id: 'ad-giraffe1x', name: 'Giraffe 1X', maker: 'Saab', country: 'Швеція', type: 'electronic', stage: 'service', q: 'Giraffe 1X',
      img: 'https://res.cloudinary.com/dkkd45ayz/image/upload/f_auto,dpr_auto,q_auto,fl_progressive/w_1.0,h_0.6287378640776699029126213592,c_fill,g_auto/w_1200,h_630,c_scale/optimizely/9b1f9540-7aa6-4369-b820-364f5e3e52ee/giraffe_1x_on_vehicle.jpg',
      blurb: 'Легкий тривимірний радар X-діапазону для ППО ближньої дії та протидії дронам. Його можна ставити на автомобілі, кораблі або стаціонарно. У 2026 році Saab отримала замовлення від Франції (17 радарів на машинах Scania) і Данії, а також від армії США. На Eurosatory 2026 компанія оголосила дальність до 250 км.',
      blurb_en: 'A lightweight 3D X-band radar for short-range air defence and counter-drone use. It can be mounted on vehicles, ships or used in fixed installations. In 2026 Saab received orders from France (17 radars on Scania vehicles) and Denmark, as well as from the US Army. At Eurosatory 2026 the company announced a range of up to 250 km.',
      specs: [['Макс. дальність', '250 км'], ['Маса системи', 'менше 150 кг'], ['Супровід цілей', 'до 2000']],
      specs_en: [['Max. range', '250 km'], ['System weight', 'under 150 kg'], ['Target tracking', 'up to 2,000']],
      links: [['Сайт виробника', 'https://www.saab.com/products/giraffe-1x'], ['Джерело: Janes', 'https://www.janes.com/defence-intelligence-insights/defence-news/c4isr/eurosatory-2026-saabs-giraffe-1x-radar-range-up-to-250-km-receives-danish-order'], ['Джерело: Nordic Defence Sector', 'https://nordicdefencesector.com/en/article/saab-receives-order-for-giraffe-1x-radar-from-france']] },
    { id: 'ad-trml4d', name: 'TRML-4D', maker: 'Hensoldt', country: 'Німеччина', type: 'electronic', stage: 'service', upd: '2026-10-05', q: 'TRML-4D',
      img: 'https://euromaidanpress.com/wp-content/uploads/2023/05/csm_TRML_4D_ret_2_200dpi_3d3cca6d96-e1684261914909.jpg',
      blurb: 'Мобільний радар ППО з АФАР, який працює як штатний радар комплексу IRIS-T SLM і як окрема станція огляду повітряного простору. В Україні він став одним із ключових сенсорів. 5 жовтня 2026 року Hensoldt підписала з Міноборони України меморандум про нові поставки та спільну розробку радарів, зокрема для протибалістичної оборони.',
      blurb_en: 'A mobile AESA air defence radar that serves as the standard radar of the IRIS-T SLM system and as a standalone airspace surveillance station. In Ukraine it has become one of the key sensors. On 5 October 2026 Hensoldt signed a memorandum with the Ministry of Defence of Ukraine on new deliveries and joint development of radars, including for ballistic missile defence.',
      specs: [['Інструментальна дальність', '250 км'], ['Висота', 'до 30 км'], ['Супровід цілей', 'близько 1500']],
      specs_en: [['Instrumented range', '250 km'], ['Altitude', 'up to 30 km'], ['Target tracking', 'about 1,500']],
      links: [['Сайт виробника', 'https://www.hensoldt.net/news/hensoldt-strengthens-ukraines-air-defence'], ['Джерело: Euromaidan Press', 'https://euromaidanpress.com/2026/10/07/german-radar-already-guarding-ukraine-is-picked-to-spot-ballistic-missiles-its-maker-just-signed-a-new-deal-with-kyiv/']] },
    { id: 'ad-lsam', name: 'L-SAM', maker: 'ADD, Hanwha Aerospace та Hanwha Systems', country: 'Південна Корея', type: 'missiles', stage: 'prod', q: 'L-SAM',
      maker_en: 'ADD, Hanwha Aerospace and Hanwha Systems',
      img: 'https://militarnyi.com/wp-content/uploads/2024/11/GOz5ycIXEAMZf-p-1-1.webp',
      blurb: 'Південнокорейський комплекс ППО/ПРО великої дальності, створений для перехоплення балістичних ракет КНДР на великих висотах. Він став верхнім ешелоном корейської протиракетної оборони. У грудні 2025 року Hanwha Aerospace отримала контракт на серійне виробництво з поставками до 2030 року. Тим часом розробляють L-SAM II з вищою стелею перехоплення.',
      blurb_en: 'A South Korean long-range air and missile defence system designed to intercept North Korean ballistic missiles at high altitudes. It has become the upper tier of Korea’s missile defence. In December 2025 Hanwha Aerospace received a series production contract with deliveries through 2030. Meanwhile, L-SAM II with a higher intercept ceiling is in development.',
      specs: [['Висота перехоплення', 'до 60 км'], ['Контракт на серійне виробництво', '705,4 млрд вон (≈$480 млн)'], ['Завершення поставок', 'до 2030 р.']],
      specs_en: [['Intercept altitude', 'up to 60 km'], ['Series production contract', '705.4 billion won (≈$480 million)'], ['Deliveries complete', 'by 2030']],
      links: [['Джерело: The Defense Post', 'https://thedefensepost.com/2025/12/03/hanwha-lsam-contract/'], ['Джерело: Militarnyi', 'https://militarnyi.com/en/news/south-korea-completes-development-of-l-sam-anti-missile-system/']] },
    { id: 'ad-siper', name: 'SİPER', maker: 'ASELSAN, Roketsan та TÜBİTAK SAGE', country: 'Туреччина', type: 'missiles', stage: 'service', upd: '2026-10-05', q: 'SIPER',
      maker_en: 'ASELSAN, Roketsan and TÜBİTAK SAGE',
      img: 'https://cdn.turdef.com/images/articles/7573/siper_2_air_defence_missile_enters_serial_production.webp',
      blurb: 'Турецька система ППО великої дальності, що є верхнім ешелоном національної мережі «Сталевий купол». SİPER-1 прийняли на озброєння в січні 2026 року після приймальних випробувань. У жовтні 2026 року ASELSAN повідомила, що ракета SİPER-2 з більшою дальністю пішла в серійне виробництво.',
      blurb_en: 'A Turkish long-range air defence system forming the upper tier of the national Steel Dome network. SİPER-1 entered service in January 2026 after acceptance trials. In October 2026 ASELSAN reported that the longer-range SİPER-2 missile had entered series production.',
      specs: [['Дальність SİPER-2', 'понад 150 км'], ['Висота SİPER-2', 'понад 30 км'], ['SİPER-1 на озброєнні', 'з січня 2026']],
      specs_en: [['SİPER-2 range', 'over 150 km'], ['SİPER-2 altitude', 'over 30 km'], ['SİPER-1 in service', 'since January 2026']],
      links: [['Сторінка проєкту (SSB)', 'https://www.ssb.gov.tr/en/project/siper-project'], ['Джерело: TURDEF', 'https://turdef.com/article/siper-2-air-defence-missile-enters-serial-production'], ['Джерело: Quwa', 'https://quwa.org/turkey/turkish-defence-news/turkiye-deploys-steel-dome-layered-air-defence-architecture-for-the-first-time-at-efes-2026/']] },
    { id: 'air-f47', name: 'F-47', maker: 'Boeing', country: 'США', type: 'air', stage: 'dev', q: 'F-47',
      img: 'https://migflug.com/afterburner/wp-content/uploads/sites/4/2026/09/f-47-hangar-artist-rendering-usaf.jpg',
      blurb: 'Пілотований винищувач шостого покоління для ВПС США, створюваний за програмою NGAD. Boeing виграв контракт на етап розробки (EMD) у березні 2025 року. F-47 має стати ядром системи, у якій пілотовані літаки діють разом із безпілотними CCA. Відкрита архітектура дає змогу додавати нові сенсори, озброєння й програмне забезпечення без перебудови планера.',
      blurb_en: 'A crewed sixth-generation fighter for the US Air Force, developed under the NGAD programme. Boeing won the engineering and manufacturing development (EMD) contract in March 2025. The F-47 is to become the core of a system in which crewed aircraft operate alongside uncrewed CCAs. Its open architecture allows new sensors, weapons and software to be added without redesigning the airframe.',
      specs: [['Перший політ', '2028 (ціль)'], ['Плановий парк', 'щонайменше 185 літаків'], ['Бойовий радіус', 'понад 1000 мор. миль (оцінка)']],
      specs_en: [['First flight', '2028 (target)'], ['Planned fleet', 'at least 185 aircraft'], ['Combat radius', 'over 1,000 nautical miles (estimate)']],
      links: [['Джерело: MigFlug Afterburner', 'https://migflug.com/afterburner/?p=25675360'], ['Джерело: Breaking Defense', 'https://breakingdefense.com/2025/09/manufacturing-of-first-f-47-next-gen-fighter-underway-air-forces-allvin-says/']] },
    { id: 'air-gcap', name: 'GCAP (Tempest)', maker: 'Edgewing (BAE Systems, Leonardo, JAIEC)', country: 'Велика Британія, Італія та Японія', type: 'air', stage: 'dev', upd: '2026-09-15', q: 'GCAP',
      img: 'https://thedefensepost.com/wp-content/uploads/2026/07/GCAP-next-generation-combat-aircraft.jpg',
      blurb: 'Тринаціональна програма винищувача шостого покоління. Головний підрядник і проєктант — спільне підприємство Edgewing. У липні 2026 року воно отримало контракт на £4,6 млрд для завершення концептуальної фази та продовження спільного детального проєктування. У вересні 2026 року Edgewing доручила консорціуму G2E (Leonardo, ELT Group, Mitsubishi Electric) розробку інтегрованих сенсорних і комунікаційних систем літака.',
      blurb_en: 'A trinational sixth-generation fighter programme. The prime contractor and design authority is the Edgewing joint venture. In July 2026 it received a £4.6 billion contract to complete the concept phase and continue joint detailed design. In September 2026 Edgewing tasked the G2E consortium (Leonardo, ELT Group, Mitsubishi Electric) with developing the aircraft’s integrated sensor and communications systems.',
      specs: [['Введення в стрій', '2035 (ціль)'], ['Контракт Edgewing', '£4,6 млрд (18 місяців)'], ['Частки в Edgewing', 'по 33,3% у BAE, Leonardo, JAIEC']],
      specs_en: [['Entry into service', '2035 (target)'], ['Edgewing contract', '£4.6 billion (18 months)'], ['Shares in Edgewing', '33.3% each for BAE, Leonardo, JAIEC']],
      links: [['Сайт виробника', 'https://www.baesystems.com/en/product/global-combat-air-programme'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/09/15/gcap-sensing-communications/'], ['Джерело: Airframer', 'https://www.airframer.com/news/story/edgewing-wins-4-6-billion-gcap-design-contract']] },
    { id: 'air-b21', name: 'B-21 Raider', maker: 'Northrop Grumman', country: 'США', type: 'air', stage: 'prod', q: 'B-21',
      img: 'https://theaviationist.com/wp-content/uploads/2026/02/B-21-Raider-Production.jpg',
      blurb: 'Малопомітний стратегічний бомбардувальник, який має замінити B-1B та B-2. Літак призначений для прориву щільної протиповітряної оборони. Випробувальні екземпляри літають на базі Едвардс. У лютому 2026 року ВПС і Northrop Grumman домовилися наростити виробничі потужності, а першу машину мають передати на базу Еллсворт у 2027 році.',
      blurb_en: 'A stealth strategic bomber intended to replace the B-1B and B-2. The aircraft is designed to penetrate dense air defences. Test aircraft are flying at Edwards Air Force Base. In February 2026 the Air Force and Northrop Grumman agreed to expand production capacity, and the first aircraft is due to be delivered to Ellsworth Air Force Base in 2027.',
      specs: [['Замовлено', '100 літаків'], ['Перша поставка', '2027 (база Еллсворт)'], ['Розширення виробництва', '+25% потужностей ($4,5 млрд)']],
      specs_en: [['Ordered', '100 aircraft'], ['First delivery', '2027 (Ellsworth AFB)'], ['Production expansion', '+25% capacity ($4.5 billion)']],
      links: [['Сайт виробника', 'https://www.northropgrumman.com/what-we-do/air/b-21-raider'], ['Джерело: The Aviationist', 'https://theaviationist.com/2026/02/24/b-21-raiders-accelerate-production/']] },
    { id: 'air-fq44-fury', name: 'FQ-44A Fury', maker: 'Anduril Industries', country: 'США', type: 'unmanned', stage: 'prod', upd: '2026-09-14', q: 'Fury',
      img: 'https://www.twz.com/wp-content/uploads/2026/09/Fury-CCA-1.jpg?w=1200',
      blurb: 'Безпілотний «ведений» (Collaborative Combat Aircraft) першого інкременту програми ВПС США, раніше відомий як YFQ-44A. У червні 2026 року його відібрали для серійного виробництва, а в липні з лінії Arsenal-1 в Огайо зійшов перший серійний планер. Апарат провів перші в історії CCA бойові пуски AIM-120. У вересні 2026 року ВПС офіційно присвоїли йому назву Fury.',
      blurb_en: 'An uncrewed loyal wingman (Collaborative Combat Aircraft) from Increment 1 of the US Air Force programme, previously known as the YFQ-44A. It was selected for series production in June 2026, and in July the first production airframe rolled off the Arsenal-1 line in Ohio. The aircraft conducted the first-ever live AIM-120 firings by a CCA. In September 2026 the Air Force officially named it Fury.',
      specs: [['Підвіска (серійна FQ-44)', '4 зовнішні точки'], ['Вартість одиниці', 'менше $20 млн (оцінка Anduril)'], ['Потужність Arsenal-1', 'до 150 апаратів на рік']],
      specs_en: [['Hardpoints (production FQ-44)', '4 external stations'], ['Unit cost', 'under $20 million (Anduril estimate)'], ['Arsenal-1 capacity', 'up to 150 aircraft per year']],
      links: [['Сайт виробника', 'https://www.anduril.com/fury/'], ['Джерело: The War Zone', 'https://www.twz.com/air/andurils-yfq-44a-fury-cca-has-flown-alongside-f-35s'], ['Джерело: Defense News', 'https://www.defensenews.com/industry/techwatch/2026/06/18/us-air-force-awards-first-cca-production-contracts-to-general-atomics-anduril/']] },
    { id: 'air-fq42-vengeance', name: 'FQ-42A Vengeance', maker: 'General Atomics Aeronautical Systems', country: 'США', type: 'unmanned', stage: 'prod', upd: '2026-09-21', q: 'Vengeance',
      img: 'https://theaviationist.com/wp-content/uploads/2026/09/WEB-FQ-42_F-35_F-15_rescale.jpg',
      blurb: 'Другий безпілотник першого інкременту CCA, малопомітний, із внутрішнім відсіком озброєння. Раніше мав назву YFQ-42A Dark Merlin. У червні 2026 року отримав виробничий контракт, хоча у квітні один прототип розбився. Літав у строю з F-35A та F-15E. У вересні 2026 року ВПС дали йому назву Vengeance, а новий апарат передали на базу Кріч.',
      blurb_en: 'The second drone in the first CCA increment, a stealthy design with an internal weapons bay. Formerly designated YFQ-42A Dark Merlin. It received a production contract in June 2026, although one prototype crashed in April. It has flown in formation with the F-35A and F-15E. In September 2026 the Air Force named it Vengeance, and a new aircraft was delivered to Creech base.',
      specs: [['Перший політ', 'серпень 2025'], ['Темп виробництва', 'до 6 на місяць (за даними GA-ASI)'], ['План ВПС щодо CCA', '500 апаратів до 2032']],
      specs_en: [['First flight', 'August 2025'], ['Production rate', 'up to 6 per month (per GA-ASI)'], ['USAF CCA plan', '500 aircraft by 2032']],
      links: [['Сайт виробника', 'https://www.ga-asi.com/us-air-force-awards-ga-asi-production-contract-for-fq-42a-cca'], ['Джерело: GA-ASI', 'https://www.ga-asi.com/fq-42-vengeance-finds-new-home-at-creech-air-force-base'], ['Джерело: The Aviationist', 'https://theaviationist.com/2026/09/14/fq-42-vengeance-and-fq-44-fury/']] },
    { id: 'air-mq28', name: 'MQ-28 Ghost Bat', maker: 'Boeing Defence Australia', country: 'Австралія', type: 'unmanned', stage: 'test', q: 'Ghost Bat',
      img: 'https://backend.ainonline.com/sites/default/files/styles/original/public/2026-07/MQ-28-R6DM2260.jpg?itok=B6EFhXDU',
      blurb: 'Перший бойовий безпілотник, розроблений і збудований в Австралії. Задуманий як «ведений» для пілотованих літаків. У грудні 2025 року MQ-28 збив повітряну ціль ракетою AIM-120, і того ж місяця Австралія замовила ще шість апаратів Block 2 та один Block 3 на A$754 млн. У 2026 році апарат дебютував на навчаннях Valiant Shield. Boeing разом із Rheinmetall просуває його в Німеччині.',
      blurb_en: 'The first combat drone designed and built in Australia, conceived as a wingman for crewed aircraft. In December 2025 the MQ-28 shot down an aerial target with an AIM-120 missile, and that same month Australia ordered six more Block 2 aircraft and one Block 3 for A$754 million. In 2026 it debuted at the Valiant Shield exercise. Boeing is promoting it in Germany together with Rheinmetall.',
      specs: [['МЗМ (Block 2)', '12 000 фунтів (≈5,4 т)'], ['Корисне навантаження (Block 2)', '4500 фунтів'], ['На озброєнні RAAF', '2028 (ціль)']],
      specs_en: [['MTOW (Block 2)', '12,000 lb (≈5.4 t)'], ['Payload (Block 2)', '4,500 lb'], ['RAAF service entry', '2028 (target)']],
      links: [['Джерело: AIN', 'https://backend.ainonline.com/aviation-news/defense/2026-07-21/ahead-rest-mq-28-nears-australian-service'], ['Джерело: Asian Military Review', 'https://www.asianmilitaryreview.com/2025/12/australia-reaffirms-its-commitment-to-mq-28a-collaborative-combat-aircraft-foc/']] },
    { id: 'air-kizilelma', name: 'Bayraktar Kızılelma', maker: 'Baykar', country: 'Туреччина', type: 'unmanned', stage: 'prod', q: 'Kizilelma',
      img: 'https://defence-industry.eu/wp-content/uploads/2026/03/Baykar-begins-serial-production-of-Kizilelma-combat-drone-first-deliveries-set-for-2026.jpg',
      blurb: 'Реактивний малопомітний ударний безпілотник, придатний до базування на кораблях. Baykar уже розгорнула серійне виробництво, поставки ВПС Туреччини заплановані на 2026 рік. У 2025–2026 роках Kızılelma провів пуски ракет «повітря–повітря» та високоточних боєприпасів. У травні 2026 року підписано першу експортну угоду: Індонезія отримає 12 апаратів із 2028 року.',
      blurb_en: 'A jet-powered stealthy strike drone suitable for shipborne operation. Baykar has already launched serial production, with deliveries to the Turkish Air Force planned for 2026. In 2025–2026 Kızılelma conducted launches of air-to-air missiles and precision munitions. The first export deal was signed in May 2026: Indonesia will receive 12 aircraft from 2028.',
      specs: [['Максимальна злітна маса', '8,5 т'], ['Корисне навантаження', '1,5 т'], ['Швидкість', '0,6 Маха крейсерська / 0,9 Маха макс.']],
      specs_en: [['Maximum takeoff weight', '8.5 t'], ['Payload', '1.5 t'], ['Speed', 'Mach 0.6 cruise / Mach 0.9 max']],
      links: [['Сайт виробника', 'https://baykartech.com/en/uav/bayraktar-kizilelma/'], ['Джерело: Janes', 'https://www.janes.com/defence-intelligence-insights/defence-news/defence/saha-2026-baykar-signs-agreement-to-export-kizilelma-to-indonesia'], ['Джерело: Defence Industry Europe', 'https://defence-industry.eu/baykar-begins-serial-production-of-kizilelma-combat-drone-first-deliveries-set-for-2026/']] },
    { id: 'air-kaan', name: 'KAAN', maker: 'Turkish Aerospace (TUSAŞ)', country: 'Туреччина', type: 'air', stage: 'test', upd: '2026-10-02', q: 'KAAN',
      img: 'https://migflug.com/afterburner/wp-content/uploads/sites/4/2026/10/tusas-kaan-p1-prototype-overhead-runway.jpg',
      blurb: 'Турецький двомоторний винищувач п’ятого покоління. Прототип P0 уперше злетів у лютому 2024 року. Прототип P1, збудований у серійній конфігурації, з липня 2026 року проходить рулювання. На початку жовтня 2026 року TUSAŞ заявила, що він злетить «за кілька тижнів». ВПС Туреччини замовили 20 літаків Block 10 із поставками з 2028 року, Індонезія — 48 машин.',
      blurb_en: 'Turkey’s twin-engine fifth-generation fighter. Prototype P0 first flew in February 2024. Prototype P1, built in the production configuration, has been taxiing since July 2026. In early October 2026 TUSAŞ said it would fly within a few weeks. The Turkish Air Force has ordered 20 Block 10 aircraft with deliveries from 2028, and Indonesia has ordered 48.',
      specs: [['Довжина', '20,3 м'], ['Макс. швидкість', '1,8 Маха (проєктна)'], ['Двигуни прототипів', '2 × GE F110']],
      specs_en: [['Length', '20.3 m'], ['Max speed', 'Mach 1.8 (design)'], ['Prototype engines', '2 × GE F110']],
      links: [['Джерело: MigFlug Afterburner', 'https://migflug.com/afterburner/kaan-p1-first-flight-weeks-away-tusas-demiroglu-teknofest-2026/'], ['Джерело: Fly a Jet Fighter', 'https://www.flyajetfighter.com/the-kaan-p1-begins-taxi-tests-ahead-of-an-expected-first-flight-in-late-2026/']] },
    { id: 'air-hx2', name: 'HX-2', maker: 'Helsing', country: 'Німеччина', type: 'unmanned', stage: 'prod', q: 'Helsing',
      img: 'https://cdn.dronexl.co/wp-content/uploads/2025/09/img_9566.jpg',
      blurb: 'Ударний дрон-барражуючий боєприпас з ШІ-наведенням, здатний діяти без GPS і запускатися з катапульти. Його постачали Україні, хоча на початку 2026 року після проблем на випробуваннях подальші замовлення поставили на паузу. У лютому 2026 року Бундестаг схвалив закупівлю для Бундесверу: перший контракт Helsing — близько €269 млн.',
      blurb_en: 'An AI-guided strike loitering munition that can operate without GPS and be catapult-launched. It has been supplied to Ukraine, although further orders were paused in early 2026 after test problems. In February 2026 the Bundestag approved a purchase for the Bundeswehr: Helsing’s first contract, worth about €269 million.',
      specs: [['Дальність', 'до 100 км'], ['Маса', '12 кг'], ['Макс. швидкість', '220 км/год']],
      specs_en: [['Range', 'up to 100 km'], ['Weight', '12 kg'], ['Max speed', '220 km/h']],
