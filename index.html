      specs_en: [['Cannon', '30 mm KCE-ABM, up to 1,250 rounds/min'], ['Cannon range', 'up to 3 km'], ['Radar', 'Hensoldt Spexer 2000M']],
      links: [['Сайт виробника', 'https://www.rheinmetall.com/en/media/news-watch/news/2024/02/2024-02-27-bundeswehr-ordered-skyranger-30-mobile-air-defence-system'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/08/10/skyranger-30-guide/'], ['Джерело: Army Recognition', 'https://www.armyrecognition.com/news/army-news/2026/skyranger-30-air-defense-system-belgium']] },
    { id: 'ad-leonidas', name: 'Leonidas HPM', maker: 'Epirus', country: 'США', type: 'missiles', stage: 'prod', q: 'Leonidas',
      img: 'https://www.twz.com/wp-content/uploads/2025/07/Epirus-HPM-Leonidas.jpg?w=1200',
      blurb: 'Твердотільна надпотужна мікрохвильова зброя на нітриді галію, яка виводить з ладу цілі рої дронів одним імпульсом. На демонстрації 2025 року система знешкодила всі 61 дрон, зокрема рій із 49 апаратів. Армія США закупила прототипи другого покоління за програмою IFPC-HPM. У серпні 2026 року Корпус морської піхоти замовив автомобільну версію HAVOC.',
      blurb_en: 'A solid-state gallium nitride high-power microwave weapon that disables entire drone swarms with a single pulse. In a 2025 demonstration the system defeated all 61 drones, including a swarm of 49. The US Army has bought second-generation prototypes under the IFPC-HPM programme. In August 2026 the Marine Corps ordered the HAVOC vehicle-mounted version.',
      specs: [['Демонстрація 2025', '61 з 61 дрона, рій із 49 одним імпульсом'], ['Контракт армії США', '$43,5 млн за 2 системи Gen II'], ['Gen II порівняно з Gen I', 'дальність більш ніж удвічі більша, потужність +30%']],
      specs_en: [['2025 demonstration', '61 of 61 drones, a swarm of 49 with one pulse'], ['US Army contract', '$43.5 million for 2 Gen II systems'], ['Gen II vs Gen I', 'more than double the range, +30% power']],
      links: [['Сайт виробника', 'https://www.epirusinc.com/platforms/hpm-leonidas'], ['Джерело: The War Zone', 'https://www.twz.com/land/army-puts-50m-bet-on-next-gen-leonidas-high-power-microwave-counter-drone-tech'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/08/11/us-marines-microwave-weapon/']] },
    { id: 'ad-giraffe1x', name: 'Giraffe 1X', maker: 'Saab', country: 'Швеція', type: 'electronic', stage: 'service', q: 'Giraffe 1X',
      img: 'https://res.cloudinary.com/dkkd45ayz/image/upload/f_auto,dpr_auto,q_auto,fl_progressive/w_1.0,h_0.6287378640776699029126213592,c_fill,g_auto/w_1200,h_630,c_scale/optimizely/9b1f9540-7aa6-4369-b820-364f5e3e52ee/giraffe_1x_on_vehicle.jpg',
      blurb: 'Легкий тривимірний радар X-діапазону для ППО ближньої дії та протидії дронам. Його можна ставити на автомобілі, кораблі або стаціонарно. У 2026 році Saab отримала замовлення від Франції (17 радарів на машинах Scania) і Данії, а також від армії США. На Eurosatory 2026 компанія оголосила дальність до 250 км.',
      blurb_en: 'A lightweight 3D X-band radar for short-range air defence and counter-drone use. It can be mounted on vehicles, ships or used in fixed installations. In 2026 Saab received orders from France (17 radars on Scania vehicles) and Denmark, as well as from the US Army. At Eurosatory 2026 the company announced a range of up to 250 km.',
      specs: [['Макс. дальність', '250 км'], ['Маса системи', 'менше 150 кг'], ['Супровід цілей', 'до 2000']],
      specs_en: [['Max. range', '250 km'], ['System weight', 'under 150 kg'], ['Target tracking', 'up to 2,000']],
      links: [['Сайт виробника', 'https://www.saab.com/products/giraffe-1x'], ['Джерело: Janes', 'https://www.janes.com/defence-intelligence-insights/defence-news/c4isr/eurosatory-2026-saabs-giraffe-1x-radar-range-up-to-250-km-receives-danish-order'], ['Джерело: Nordic Defence Sector', 'https://nordicdefencesector.com/en/article/saab-receives-order-for-giraffe-1x-radar-from-france']] },
    { id: 'ad-trml4d', name: 'TRML-4D', maker: 'Hensoldt', country: 'Німеччина', type: 'electronic', stage: 'service', upd: '2026-10-05', q: 'TRML-4D',
      img: 'https://euromaidanpress.com/wp-content/uploads/2023/05/csm_TRML_4D_ret_2_200dpi_3d3cca6d96-e1684261914909.jpg',
      blurb: 'Мобільний радар ППО з АФАР, який працює як штатний радар комплексу IRIS-T SLM і як окрема станція огляду повітряного простору. В Україні він став одним із ключових сенсорів. 5 жовтня 2026 року Hensoldt підписала з Міноборони України меморандум про нові поставки та спільну розробку радарів, зокрема для протибалістичної оборони.',
      blurb_en: 'A mobile AESA air defence radar that serves as the standard radar of the IRIS-T SLM system and as a standalone airspace surveillance station. In Ukraine it has become one of the key sensors. On 5 October 2026 Hensoldt signed a memorandum with the Ministry of Defence of Ukraine on new deliveries and joint development of radars, including for ballistic missile defence.',
      specs: [['Інструментальна дальність', '250 км'], ['Висота', 'до 30 км'], ['Супровід цілей', 'близько 1500']],
      specs_en: [['Instrumented range', '250 km'], ['Altitude', 'up to 30 km'], ['Target tracking', 'about 1,500']],
      links: [['Сайт виробника', 'https://www.hensoldt.net/news/hensoldt-strengthens-ukraines-air-defence'], ['Джерело: Euromaidan Press', 'https://euromaidanpress.com/2026/10/07/german-radar-already-guarding-ukraine-is-picked-to-spot-ballistic-missiles-its-maker-just-signed-a-new-deal-with-kyiv/']] },
    { id: 'ad-lsam', name: 'L-SAM', maker: 'ADD, Hanwha Aerospace та Hanwha Systems', country: 'Південна Корея', type: 'missiles', stage: 'prod', q: 'L-SAM',
      maker_en: 'ADD, Hanwha Aerospace and Hanwha Systems',
      img: 'https://militarnyi.com/wp-content/uploads/2024/11/GOz5ycIXEAMZf-p-1-1.webp',
      blurb: 'Південнокорейський комплекс ППО/ПРО великої дальності, створений для перехоплення балістичних ракет КНДР на великих висотах. Він став верхнім ешелоном корейської протиракетної оборони. У грудні 2025 року Hanwha Aerospace отримала контракт на серійне виробництво з поставками до 2030 року. Тим часом розробляють L-SAM II з вищою стелею перехоплення.',
      blurb_en: 'A South Korean long-range air and missile defence system designed to intercept North Korean ballistic missiles at high altitudes. It has become the upper tier of Korea’s missile defence. In December 2025 Hanwha Aerospace received a series production contract with deliveries through 2030. Meanwhile, L-SAM II with a higher intercept ceiling is in development.',
      specs: [['Висота перехоплення', 'до 60 км'], ['Контракт на серійне виробництво', '705,4 млрд вон (≈$480 млн)'], ['Завершення поставок', 'до 2030 р.']],
      specs_en: [['Intercept altitude', 'up to 60 km'], ['Series production contract', '705.4 billion won (≈$480 million)'], ['Deliveries complete', 'by 2030']],
      links: [['Джерело: The Defense Post', 'https://thedefensepost.com/2025/12/03/hanwha-lsam-contract/'], ['Джерело: Militarnyi', 'https://militarnyi.com/en/news/south-korea-completes-development-of-l-sam-anti-missile-system/']] },
    { id: 'ad-siper', name: 'SİPER', maker: 'ASELSAN, Roketsan та TÜBİTAK SAGE', country: 'Туреччина', type: 'missiles', stage: 'service', upd: '2026-10-05', q: 'SIPER',
      maker_en: 'ASELSAN, Roketsan and TÜBİTAK SAGE',
      img: 'https://cdn.turdef.com/images/articles/7573/siper_2_air_defence_missile_enters_serial_production.webp',
      blurb: 'Турецька система ППО великої дальності, що є верхнім ешелоном національної мережі «Сталевий купол». SİPER-1 прийняли на озброєння в січні 2026 року після приймальних випробувань. У жовтні 2026 року ASELSAN повідомила, що ракета SİPER-2 з більшою дальністю пішла в серійне виробництво.',
      blurb_en: 'A Turkish long-range air defence system forming the upper tier of the national Steel Dome network. SİPER-1 entered service in January 2026 after acceptance trials. In October 2026 ASELSAN reported that the longer-range SİPER-2 missile had entered series production.',
      specs: [['Дальність SİPER-2', 'понад 150 км'], ['Висота SİPER-2', 'понад 30 км'], ['SİPER-1 на озброєнні', 'з січня 2026']],
      specs_en: [['SİPER-2 range', 'over 150 km'], ['SİPER-2 altitude', 'over 30 km'], ['SİPER-1 in service', 'since January 2026']],
      links: [['Сторінка проєкту (SSB)', 'https://www.ssb.gov.tr/en/project/siper-project'], ['Джерело: TURDEF', 'https://turdef.com/article/siper-2-air-defence-missile-enters-serial-production'], ['Джерело: Quwa', 'https://quwa.org/turkey/turkish-defence-news/turkiye-deploys-steel-dome-layered-air-defence-architecture-for-the-first-time-at-efes-2026/']] },
    { id: 'air-f47', name: 'F-47', maker: 'Boeing', country: 'США', type: 'air', stage: 'dev', q: 'F-47',
      img: 'https://migflug.com/afterburner/wp-content/uploads/sites/4/2026/09/f-47-hangar-artist-rendering-usaf.jpg',
      blurb: 'Пілотований винищувач шостого покоління для ВПС США, створюваний за програмою NGAD. Boeing виграв контракт на етап розробки (EMD) у березні 2025 року. F-47 має стати ядром системи, у якій пілотовані літаки діють разом із безпілотними CCA. Відкрита архітектура дає змогу додавати нові сенсори, озброєння й програмне забезпечення без перебудови планера.',
      blurb_en: 'A crewed sixth-generation fighter for the US Air Force, developed under the NGAD programme. Boeing won the engineering and manufacturing development (EMD) contract in March 2025. The F-47 is to become the core of a system in which crewed aircraft operate alongside uncrewed CCAs. Its open architecture allows new sensors, weapons and software to be added without redesigning the airframe.',
      specs: [['Перший політ', '2028 (ціль)'], ['Плановий парк', 'щонайменше 185 літаків'], ['Бойовий радіус', 'понад 1000 мор. миль (оцінка)']],
      specs_en: [['First flight', '2028 (target)'], ['Planned fleet', 'at least 185 aircraft'], ['Combat radius', 'over 1,000 nautical miles (estimate)']],
      links: [['Джерело: MigFlug Afterburner', 'https://migflug.com/afterburner/?p=25675360'], ['Джерело: Breaking Defense', 'https://breakingdefense.com/2025/09/manufacturing-of-first-f-47-next-gen-fighter-underway-air-forces-allvin-says/']] },
    { id: 'air-gcap', name: 'GCAP (Tempest)', maker: 'Edgewing (BAE Systems, Leonardo, JAIEC)', country: 'Велика Британія, Італія та Японія', type: 'air', stage: 'dev', upd: '2026-09-15', q: 'GCAP',
      img: 'https://thedefensepost.com/wp-content/uploads/2026/07/GCAP-next-generation-combat-aircraft.jpg',
      blurb: 'Тринаціональна програма винищувача шостого покоління. Головний підрядник і проєктант — спільне підприємство Edgewing. У липні 2026 року воно отримало контракт на £4,6 млрд для завершення концептуальної фази та продовження спільного детального проєктування. У вересні 2026 року Edgewing доручила консорціуму G2E (Leonardo, ELT Group, Mitsubishi Electric) розробку інтегрованих сенсорних і комунікаційних систем літака.',
      blurb_en: 'A trinational sixth-generation fighter programme. The prime contractor and design authority is the Edgewing joint venture. In July 2026 it received a £4.6 billion contract to complete the concept phase and continue joint detailed design. In September 2026 Edgewing tasked the G2E consortium (Leonardo, ELT Group, Mitsubishi Electric) with developing the aircraft’s integrated sensor and communications systems.',
      specs: [['Введення в стрій', '2035 (ціль)'], ['Контракт Edgewing', '£4,6 млрд (18 місяців)'], ['Частки в Edgewing', 'по 33,3% у BAE, Leonardo, JAIEC']],
      specs_en: [['Entry into service', '2035 (target)'], ['Edgewing contract', '£4.6 billion (18 months)'], ['Shares in Edgewing', '33.3% each for BAE, Leonardo, JAIEC']],
      links: [['Сайт виробника', 'https://www.baesystems.com/en/product/global-combat-air-programme'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/09/15/gcap-sensing-communications/'], ['Джерело: Airframer', 'https://www.airframer.com/news/story/edgewing-wins-4-6-billion-gcap-design-contract']] },
    { id: 'air-b21', name: 'B-21 Raider', maker: 'Northrop Grumman', country: 'США', type: 'air', stage: 'prod', q: 'B-21',
      img: 'https://theaviationist.com/wp-content/uploads/2026/02/B-21-Raider-Production.jpg',
      blurb: 'Малопомітний стратегічний бомбардувальник, який має замінити B-1B та B-2. Літак призначений для прориву щільної протиповітряної оборони. Випробувальні екземпляри літають на базі Едвардс. У лютому 2026 року ВПС і Northrop Grumman домовилися наростити виробничі потужності, а першу машину мають передати на базу Еллсворт у 2027 році.',
      blurb_en: 'A stealth strategic bomber intended to replace the B-1B and B-2. The aircraft is designed to penetrate dense air defences. Test aircraft are flying at Edwards Air Force Base. In February 2026 the Air Force and Northrop Grumman agreed to expand production capacity, and the first aircraft is due to be delivered to Ellsworth Air Force Base in 2027.',
      specs: [['Замовлено', '100 літаків'], ['Перша поставка', '2027 (база Еллсворт)'], ['Розширення виробництва', '+25% потужностей ($4,5 млрд)']],
      specs_en: [['Ordered', '100 aircraft'], ['First delivery', '2027 (Ellsworth AFB)'], ['Production expansion', '+25% capacity ($4.5 billion)']],
      links: [['Сайт виробника', 'https://www.northropgrumman.com/what-we-do/air/b-21-raider'], ['Джерело: The Aviationist', 'https://theaviationist.com/2026/02/24/b-21-raiders-accelerate-production/']] },
    { id: 'air-fq44-fury', name: 'FQ-44A Fury', maker: 'Anduril Industries', country: 'США', type: 'unmanned', stage: 'prod', upd: '2026-10-19', q: 'Fury',
      img: 'https://www.twz.com/wp-content/uploads/2026/10/F-22-control-FQ-44-fury-test.jpg?w=1200',
      blurb: 'Безпілотний «ведений» (Collaborative Combat Aircraft) першого інкременту програми ВПС США, раніше відомий як YFQ-44A. У червні 2026 року його відібрали для серійного виробництва, а в липні з лінії Arsenal-1 в Огайо зійшов перший серійний планер. Апарат провів перші в історії CCA бойові пуски AIM-120. У вересні 2026 року ВПС офіційно присвоїли йому назву Fury, а в жовтні 2026 р. над базою Едвардс пілот F-22 уперше керував YFQ-44A прямо з кабіни, передаючи тактичні команди через лінію даних.',
      blurb_en: 'An uncrewed loyal wingman (Collaborative Combat Aircraft) from Increment 1 of the US Air Force programme, previously known as the YFQ-44A. It was selected for series production in June 2026, and in July the first production airframe rolled off the Arsenal-1 line in Ohio. The aircraft conducted the first-ever live AIM-120 firings by a CCA. In September 2026 the Air Force officially named it Fury, and in October 2026 an F-22 pilot over Edwards AFB commanded a YFQ-44A from the cockpit for the first time, sending tactical directives over a data link.',
      specs: [['Підвіска (серійна FQ-44)', '4 зовнішні точки'], ['Вартість одиниці', 'менше $20 млн (оцінка Anduril)'], ['Потужність Arsenal-1', 'до 150 апаратів на рік']],
      specs_en: [['Hardpoints (production FQ-44)', '4 external stations'], ['Unit cost', 'under $20 million (Anduril estimate)'], ['Arsenal-1 capacity', 'up to 150 aircraft per year']],
      links: [['Сайт виробника', 'https://www.anduril.com/fury/'], ['Джерело: The War Zone', 'https://www.twz.com/air/f-22-pilot-controls-fq-44-fighter-drone-from-the-cockpit-for-the-first-time'], ['Джерело: Defense News', 'https://www.defensenews.com/industry/techwatch/2026/06/18/us-air-force-awards-first-cca-production-contracts-to-general-atomics-anduril/']] },
    { id: 'air-fq42-vengeance', name: 'FQ-42A Vengeance', maker: 'General Atomics Aeronautical Systems', country: 'США', type: 'unmanned', stage: 'prod', upd: '2026-09-21', q: 'Vengeance',
      img: 'https://theaviationist.com/wp-content/uploads/2026/09/WEB-FQ-42_F-35_F-15_rescale.jpg',
      blurb: 'Другий безпілотник першого інкременту CCA, малопомітний, із внутрішнім відсіком озброєння. Раніше мав назву YFQ-42A Dark Merlin. У червні 2026 року отримав виробничий контракт, хоча у квітні один прототип розбився. Літав у строю з F-35A та F-15E. У вересні 2026 року ВПС дали йому назву Vengeance, а новий апарат передали на базу Кріч.',
      blurb_en: 'The second drone in the first CCA increment, a stealthy design with an internal weapons bay. Formerly designated YFQ-42A Dark Merlin. It received a production contract in June 2026, although one prototype crashed in April. It has flown in formation with the F-35A and F-15E. In September 2026 the Air Force named it Vengeance, and a new aircraft was delivered to Creech base.',
      specs: [['Перший політ', 'серпень 2025'], ['Темп виробництва', 'до 6 на місяць (за даними GA-ASI)'], ['План ВПС щодо CCA', '500 апаратів до 2032']],
      specs_en: [['First flight', 'August 2025'], ['Production rate', 'up to 6 per month (per GA-ASI)'], ['USAF CCA plan', '500 aircraft by 2032']],
      links: [['Сайт виробника', 'https://www.ga-asi.com/us-air-force-awards-ga-asi-production-contract-for-fq-42a-cca'], ['Джерело: GA-ASI', 'https://www.ga-asi.com/fq-42-vengeance-finds-new-home-at-creech-air-force-base'], ['Джерело: The Aviationist', 'https://theaviationist.com/2026/09/14/fq-42-vengeance-and-fq-44-fury/']] },
    { id: 'air-mq28', name: 'MQ-28 Ghost Bat', maker: 'Boeing Defence Australia', country: 'Австралія', type: 'unmanned', stage: 'test', upd: '2026-10-21', q: 'Ghost Bat',
      img: 'https://backend.ainonline.com/sites/default/files/styles/original/public/2026-07/MQ-28-R6DM2260.jpg?itok=B6EFhXDU',
      blurb: 'Перший бойовий безпілотник, розроблений і збудований в Австралії. Задуманий як «ведений» для пілотованих літаків. У грудні 2025 року MQ-28 збив повітряну ціль ракетою AIM-120, і того ж місяця Австралія замовила ще шість апаратів Block 2 та один Block 3 на A$754 млн. У 2026 році апарат дебютував на навчаннях Valiant Shield. У жовтні 2026 р. Німеччина відмовилася від прямої прискореної закупівлі MQ-28 Block 3 на користь ширшого конкурсу, де Ghost Bat залишається одним із кандидатів.',
      blurb_en: 'The first combat drone designed and built in Australia, conceived as a wingman for crewed aircraft. In December 2025 the MQ-28 shot down an aerial target with an AIM-120 missile, and that same month Australia ordered six more Block 2 aircraft and one Block 3 for A$754 million. In 2026 it debuted at the Valiant Shield exercise. In October 2026 Germany dropped a direct rapid purchase of the MQ-28 Block 3 in favour of a broader competition in which Ghost Bat remains a candidate.',
      specs: [['МЗМ (Block 2)', '12 000 фунтів (≈5,4 т)'], ['Корисне навантаження (Block 2)', '4500 фунтів'], ['На озброєнні RAAF', '2028 (ціль)']],
      specs_en: [['MTOW (Block 2)', '12,000 lb (≈5.4 t)'], ['Payload (Block 2)', '4,500 lb'], ['RAAF service entry', '2028 (target)']],
      links: [['Джерело: AIN', 'https://backend.ainonline.com/aviation-news/defense/2026-07-21/ahead-rest-mq-28-nears-australian-service'], ['Джерело: Asian Military Review', 'https://www.asianmilitaryreview.com/2025/12/australia-reaffirms-its-commitment-to-mq-28a-collaborative-combat-aircraft-foc/'], ['Джерело: The War Zone', 'https://www.twz.com/air/germany-drops-boeing-mq-28-ghost-bat-rapid-procurement-plan']] },
    { id: 'air-kizilelma', name: 'Bayraktar Kızılelma', maker: 'Baykar', country: 'Туреччина', type: 'unmanned', stage: 'prod', q: 'Kizilelma',
      img: 'https://defence-industry.eu/wp-content/uploads/2026/03/Baykar-begins-serial-production-of-Kizilelma-combat-drone-first-deliveries-set-for-2026.jpg',
      blurb: 'Реактивний малопомітний ударний безпілотник, придатний до базування на кораблях. Baykar уже розгорнула серійне виробництво, поставки ВПС Туреччини заплановані на 2026 рік. У 2025–2026 роках Kızılelma провів пуски ракет «повітря–повітря» та високоточних боєприпасів. У травні 2026 року підписано першу експортну угоду: Індонезія отримає 12 апаратів із 2028 року.',
      blurb_en: 'A jet-powered stealthy strike drone suitable for shipborne operation. Baykar has already launched serial production, with deliveries to the Turkish Air Force planned for 2026. In 2025–2026 Kızılelma conducted launches of air-to-air missiles and precision munitions. The first export deal was signed in May 2026: Indonesia will receive 12 aircraft from 2028.',
      specs: [['Максимальна злітна маса', '8,5 т'], ['Корисне навантаження', '1,5 т'], ['Швидкість', '0,6 Маха крейсерська / 0,9 Маха макс.']],
      specs_en: [['Maximum takeoff weight', '8.5 t'], ['Payload', '1.5 t'], ['Speed', 'Mach 0.6 cruise / Mach 0.9 max']],
      links: [['Сайт виробника', 'https://baykartech.com/en/uav/bayraktar-kizilelma/'], ['Джерело: Janes', 'https://www.janes.com/defence-intelligence-insights/defence-news/defence/saha-2026-baykar-signs-agreement-to-export-kizilelma-to-indonesia'], ['Джерело: Defence Industry Europe', 'https://defence-industry.eu/baykar-begins-serial-production-of-kizilelma-combat-drone-first-deliveries-set-for-2026/']] },
    { id: 'air-kaan', name: 'KAAN', maker: 'Turkish Aerospace (TUSAŞ)', country: 'Туреччина', type: 'air', stage: 'test', upd: '2026-10-02', q: 'KAAN',
      img: 'https://migflug.com/afterburner/wp-content/uploads/sites/4/2026/10/tusas-kaan-p1-prototype-overhead-runway.jpg',
      blurb: 'Турецький двомоторний винищувач п’ятого покоління. Прототип P0 уперше злетів у лютому 2024 року. Прототип P1, збудований у серійній конфігурації, з липня 2026 року проходить рулювання. На початку жовтня 2026 року TUSAŞ заявила, що він злетить «за кілька тижнів». ВПС Туреччини замовили 20 літаків Block 10 із поставками з 2028 року, Індонезія — 48 машин.',
      blurb_en: 'Turkey’s twin-engine fifth-generation fighter. Prototype P0 first flew in February 2024. Prototype P1, built in the production configuration, has been taxiing since July 2026. In early October 2026 TUSAŞ said it would fly within a few weeks. The Turkish Air Force has ordered 20 Block 10 aircraft with deliveries from 2028, and Indonesia has ordered 48.',
      specs: [['Довжина', '20,3 м'], ['Макс. швидкість', '1,8 Маха (проєктна)'], ['Двигуни прототипів', '2 × GE F110']],
      specs_en: [['Length', '20.3 m'], ['Max speed', 'Mach 1.8 (design)'], ['Prototype engines', '2 × GE F110']],
      links: [['Джерело: MigFlug Afterburner', 'https://migflug.com/afterburner/kaan-p1-first-flight-weeks-away-tusas-demiroglu-teknofest-2026/'], ['Джерело: Fly a Jet Fighter', 'https://www.flyajetfighter.com/the-kaan-p1-begins-taxi-tests-ahead-of-an-expected-first-flight-in-late-2026/']] },
    { id: 'air-hx2', name: 'HX-2', maker: 'Helsing', country: 'Німеччина', type: 'unmanned', stage: 'prod', q: 'Helsing',
      img: 'https://cdn.dronexl.co/wp-content/uploads/2025/09/img_9566.jpg',
      blurb: 'Ударний дрон-барражуючий боєприпас з ШІ-наведенням, здатний діяти без GPS і запускатися з катапульти. Його постачали Україні, хоча на початку 2026 року після проблем на випробуваннях подальші замовлення поставили на паузу. У лютому 2026 року Бундестаг схвалив закупівлю для Бундесверу: перший контракт Helsing — близько €269 млн.',
      blurb_en: 'An AI-guided strike loitering munition that can operate without GPS and be catapult-launched. It has been supplied to Ukraine, although further orders were paused in early 2026 after test problems. In February 2026 the Bundestag approved a purchase for the Bundeswehr: Helsing’s first contract, worth about €269 million.',
      specs: [['Дальність', 'до 100 км'], ['Маса', '12 кг'], ['Макс. швидкість', '220 км/год']],
      specs_en: [['Range', 'up to 100 km'], ['Weight', '12 kg'], ['Max speed', '220 km/h']],
      links: [['Сайт виробника', 'https://helsing.ai/hx-2'], ['Джерело: DroneXL', 'https://dronexl.co/2026/02/25/germany-helsing-stark-kamikaze-drone-deal/'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/01/20/ukraine-pause-helsing-hx2']] },
    { id: 'air-ghost-shark', name: 'Ghost Shark', maker: 'Anduril Australia', country: 'Австралія', type: 'unmanned', stage: 'prod', upd: '2026-10-20', q: 'Ghost Shark',
      img: 'https://www.navalnews.com/wp-content/uploads/2025/10/Anduril-Ghost-Shark-Factory-55128-scaled.jpg',
      blurb: 'Надвеликий автономний підводний апарат (XL-AUV) для розвідки та ударних місій на великій відстані. Від концепції до виробництва його довели приблизно за три роки. У вересні 2025 року ВМС Австралії уклали п’ятирічний контракт на A$1,7 млрд на кілька десятків апаратів. Їх збирають на заводі в Сіднеї, і апарати вже сходять з лінії дедалі швидше. У жовтні 2026 р. уряд Австралії оголосив нові корисні навантаження — морські міни, контейнери постачання та дрони Altius — у межах до A$5,8 млрд на підводні безекіпажні можливості за десятиліття.',
      blurb_en: 'An extra-large autonomous undersea vehicle (XL-AUV) for long-range reconnaissance and strike missions. It went from concept to production in about three years. In September 2025 the Royal Australian Navy signed a five-year A$1.7 billion contract for several dozen vehicles. They are assembled at a plant in Sydney, where vehicles are now coming off the line at an increasing rate. In October 2026 the Australian government announced new payloads — sea mines, supply caches and Altius drones — within up to A$5.8 billion for undersea uncrewed capabilities over the decade.',
      specs: [['Контракт', 'A$1,7 млрд (5 років)'], ['Завод у Сіднеї', '7400 м²'], ['Нові навантаження', 'міни, контейнери постачання, дрони Altius']],
      specs_en: [['Contract', 'A$1.7 billion (5 years)'], ['Sydney plant', '7,400 m²'], ['New payloads', 'mines, supply caches, Altius drones']],
      links: [['Джерело: Naval News', 'https://www.navalnews.com/event-news/indo-pacific-2025/2025/10/anduril-launches-australian-ghost-shark-factory-in-sydney/'], ['Джерело: Baird Maritime / Reuters', 'https://www.bairdmaritime.com/security/naval/unmanned-naval-systems/australia-announces-11b-anduril-undersea-drone-fleet'], ['Джерело: Naval News', 'https://www.navalnews.com/naval-news/2026/10/australia-advances-undersea-warfare-capabilities/']] },
    { id: 'air-mq25', name: 'MQ-25A Stingray', maker: 'Boeing', country: 'США', type: 'unmanned', stage: 'prod', upd: '2026-10-21', q: 'MQ-25',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/IG6VCDCMPZH4FA25RK5B2TZ3FE.jpeg?width=1200&auth=fe7b5fbe6275c8e381affd50190ab3237085f3bcc994c2054348c3daac9aa853',
      blurb: 'Перший бойовий безпілотник палубного базування ВМС США, насамперед це повітряний танкер для авіакрила авіаносця. Серійний зразок уперше злетів 25 квітня 2026 року, у травні програма пройшла рубіж Milestone C. У вересні 2026 року Boeing отримав перший контракт на малосерійне виробництво, а в жовтні 2026 р. авіаносець Ronald Reagan у морі вперше керував MQ-25A через супутниковий канал на відстані близько 3400 км. Початкова боєготовність очікується у 2029 році.',
      blurb_en: 'The US Navy’s first carrier-based combat drone, primarily an aerial tanker for the carrier air wing. The production-representative aircraft first flew on 25 April 2026, and the program passed Milestone C in May. In September 2026 Boeing received the first low-rate initial production contract, and in October 2026 the carrier Ronald Reagan, under way at sea, controlled an MQ-25A for the first time over a satellite link about 2,100 miles away. Initial operational capability is expected in 2029.',
      specs: [['Передача палива', '≥14 000 фунтів на 500 мор. миль (вимога)'], ['Програма', '76 апаратів (67 бойових + 9 випробувальних)'], ['Контракт Lot 1', '$562 млн, 3 апарати']],
      specs_en: [['Fuel offload', '≥14,000 lb at 500 nmi (requirement)'], ['Program', '76 aircraft (67 operational + 9 test)'], ['Lot 1 contract', '$562 million, 3 aircraft']],
      links: [['Джерело: Defense News', 'https://www.defensenews.com/industry/techwatch/2026/09/15/us-navy-boeing-ink-first-mq-25a-stingray-production-contract/'], ['Джерело: Naval News', 'https://www.navalnews.com/naval-news/2026/10/us-navy-carrier-remote-controls-mq-25a-stingray-over-2100-miles-away/'], ['Джерело: U.S. Navy', 'https://www.navy.mil/Press-Office/News-Stories/display-news/Article/4471026/mq-25a-stingray-achieves-successful-first-flight-advancing-future-of-naval-avia/']] },
    { id: 'air-lattice', name: 'Lattice', maker: 'Anduril Industries', country: 'США', type: 'ai', stage: 'service', q: 'Lattice',
      img: 'https://defensescoop.com/wp-content/uploads/sites/8/2026/03/Anduril-Sign.jpg',
      blurb: 'Програмна платформа Anduril з відкритою архітектурою на основі ШІ. Вона об’єднує дані з сенсорів, засоби ураження та автономні системи в єдине середовище командування й управління. Lattice керує безпілотниками компанії та системами протидії дронам. У березні 2026 року армія США уклала з Anduril рамковий контракт на суму до $20 млрд, у якому Lattice слугує основою C2 для протидії БпЛА.',
      blurb_en: 'Anduril’s open-architecture, AI-based software platform. It fuses sensor data, effectors and autonomous systems into a single command-and-control environment. Lattice controls the company’s drones and counter-drone systems. In March 2026 the US Army awarded Anduril a framework contract worth up to $20 billion, in which Lattice serves as the C2 backbone for counter-UAS.',
      specs: [['Контракт армії США', 'до $20 млрд (до 2036 року)'], ['Перше замовлення', '$87 млн (JIATF-401, протидія дронам)']],
      specs_en: [['US Army contract', 'up to $20 billion (through 2036)'], ['First order', '$87 million (JIATF-401, counter-drone)']],
      links: [['Сайт виробника', 'https://www.anduril.com/lattice/'], ['Джерело: DefenseScoop', 'https://defensescoop.com/2026/03/14/anduril-20-billion-dollar-army-contract/']] },
    { id: 'air-maven', name: 'Maven Smart System', maker: 'Palantir Technologies', country: 'США', type: 'ai', stage: 'service', q: 'Maven',
      img: 'https://cdn.defenseone.com/media/img/cd/2026/09/09/9532591/open-graph.jpg',
      blurb: 'ШІ-платформа Palantir для злиття й аналізу розвідувальних даних із супутників, дронів та інших сенсорів. Її використовують усі бойові командування США. У 2026 році Пентагон закріплює Maven як програму постійного фінансування (program of record). Систему розширюють від розвідки й операцій на готовність, логістику та бюджетування.',
      blurb_en: 'Palantir’s AI platform for fusing and analysing intelligence data from satellites, drones and other sensors. It is used by all US combatant commands. In 2026 the Pentagon is establishing Maven as a program of record. The system is being expanded from intelligence and operations to readiness, logistics and budgeting.',
      specs: [['Користувачі', 'усі бойові командування США'], ['Замінила', 'від 6 до 10 окремих ІТ-систем']],
      specs_en: [['Users', 'all US combatant commands'], ['Replaced', '6 to 10 separate IT systems']],
      links: [['Сайт виробника', 'https://www.palantir.com/platforms/maven/'], ['Джерело: Defense One', 'https://www.defenseone.com/technology/2026/09/maven-becoming-pentagons-everything-app/415882/'], ['Джерело: CDO Magazine', 'https://www.cdomagazine.tech/us-federal-news-bureau/palantirs-maven-ai-set-for-long-term-pentagon-use']] },
    { id: 'air-eurodrone', name: 'Eurodrone (U950)', maker: 'Airbus Defence and Space, Leonardo, Dassault Aviation', country: 'Німеччина, Франція, Італія та Іспанія', type: 'unmanned', stage: 'dev', q: 'Eurodrone',
      img: 'https://www.airbus.com/sites/g/files/jlcbta136/files/styles/w1200h675/public/2022-06/euro_render_tr_0522.jpg?itok=v8N0tK8x',
      blurb: 'Перший повністю європейський безпілотник класу MALE, без американських компонентів, що підпадають під ITAR. Його проєктують із розрахунку на сертифікацію для польотів у цивільному повітряному просторі. У жовтні 2025 року програма OCCAR завершила критичний огляд проєкту (CDR) і перейшла до виготовлення прототипу та наземних випробувань. Контракт передбачає 20 систем.',
      blurb_en: 'The first fully European MALE-class drone, free of ITAR-controlled American components. It is being designed for certification to fly in civil airspace. In October 2025 the OCCAR program completed its critical design review (CDR) and moved on to prototype manufacturing and ground testing. The contract covers 20 systems.',
      specs: [['Максимальна злітна маса', '≈11 000 кг'], ['Корисне навантаження', '2,3 т'], ['Замовлення', '20 систем (60 БпЛА, 40 станцій керування)']],
      specs_en: [['Maximum takeoff weight', '≈11,000 kg'], ['Payload', '2.3 t'], ['Order', '20 systems (60 UAVs, 40 ground control stations)']],
      links: [['Сайт виробника', 'https://www.airbus.com/en/products-services/defence/uas/eurodrone'], ['Джерело: Defence Industry Europe', 'https://defence-industry.eu/eurodrone-programme-completes-critical-design-review-paving-way-for-prototype-and-test-phase/']] },
    { id: 'air-globaleye', name: 'GlobalEye', maker: 'Saab', country: 'Швеція', type: 'air', stage: 'service', q: 'GlobalEye',
      img: 'https://res.cloudinary.com/dkkd45ayz/image/upload/f_auto,dpr_auto,q_auto,fl_progressive/w_1.0,h_0.5249221183800623052959501558,c_fill,g_auto/w_1200,h_630,c_scale/saab/31558',
      blurb: 'Літак дальнього радіолокаційного виявлення та управління на базі бізнес-джета Bombardier Global 6000/6500 з радаром Erieye ER. Він виявляє повітряні, морські й наземні цілі, зокрема низьколітні дрони та крилаті ракети. У 2026 році попит на систему зріс: NATO обрало GlobalEye, а в липні Saab отримав замовлення на два літаки від близькосхідного замовника на 10,1 млрд шведських крон.',
      blurb_en: 'An airborne early warning and control aircraft based on the Bombardier Global 6000/6500 business jet with the Erieye ER radar. It detects air, sea and ground targets, including low-flying drones and cruise missiles. Demand grew in 2026: NATO selected GlobalEye, and in July Saab received an order for two aircraft from a Middle Eastern customer worth SEK 10.1 billion.',
      specs: [['Виявлення низьколітних цілей', 'понад 400 км (з висоти 35 000 футів)'], ['Тривалість польоту', '12 год'], ['Платформа', 'Bombardier Global 6000/6500']],
      specs_en: [['Low-flying target detection', 'over 400 km (from 35,000 ft)'], ['Endurance', '12 h'], ['Platform', 'Bombardier Global 6000/6500']],
      links: [['Сайт виробника', 'https://www.saab.com/products/globaleye'], ['Джерело: Saab (прес-реліз)', 'https://www.saab.com/globalassets/cision/documents/2026/20260727-saab-receives-order-for-globaleye-en-0-5402124.pdf']] },
    { id: 'ls-darkeagle', name: 'Dark Eagle (LRHW)', maker: 'Lockheed Martin / Northrop Grumman', country: 'США', type: 'missiles', stage: 'prod', q: 'Dark Eagle',
      img: 'https://www.defensemagazine.com/cache/images/full/876/876--dark-eagle.jpg',
      blurb: 'Наземний гіперзвуковий комплекс Армії США з планерною бойовою частиною Common Hypersonic Glide Body для ударів по добре захищених і термінових цілях. Перша батарея на базі Льюїс-Маккорд отримала пускові установки та частину ракет, а 26 березня 2026 року відбувся ще один успішний пуск з мису Канаверал. Повне розгортання гальмують затримки з постачанням ракет.',
      blurb_en: 'The US Army’s ground-launched hypersonic system with the Common Hypersonic Glide Body warhead for striking well-defended and time-sensitive targets. The first battery at Joint Base Lewis-McChord has received launchers and some missiles, and another successful launch took place from Cape Canaveral on 26 March 2026. Full deployment is held back by delays in missile deliveries.',
      specs: [['Дальність', 'близько 2 776 км (1 725 миль)'], ['Швидкість', 'понад 5 М'], ['Батарея', '4 пускові установки × 2 ракети']],
      specs_en: [['Range', 'about 2,776 km (1,725 miles)'], ['Speed', 'over Mach 5'], ['Battery', '4 launchers × 2 missiles']],
      links: [['Джерело: CRS (Конгрес США)', 'https://www.everycrsreport.com/files/2026-07-07_IF11991_9778d81c5187ff7d17b8e732515b46db4c1cccc9.html'], ['Джерело: Army Recognition', 'https://www.armyrecognition.com/news/army-news/2026/us-army-to-deploy-first-operational-dark-eagle-hypersonic-missile-with-3-500-km-range-in-coming-weeks']] },
    { id: 'ls-hacm', name: 'HACM (Hypersonic Attack Cruise Missile)', maker: 'Raytheon (RTX) / Northrop Grumman', country: 'США', type: 'missiles', stage: 'test', upd: '2026-10-05', q: 'HACM',
      img: 'https://www.twz.com/wp-content/uploads/2026/10/hacm-flight-testing-has-begun.jpg?w=1200',
      blurb: 'Гіперзвукова крилата ракета ВПС США з гіперзвуковим прямоточним двигуном (ГПВРД), розроблена на основі концепції DARPA HAWC у межах програми SCIFiRE разом з Австралією. У жовтні 2026 року ВПС підтвердили перше скидання льотного зразка над австралійським полігоном. Рішення про швидку закупівлю очікують у 2027 році.',
      blurb_en: 'A US Air Force hypersonic cruise missile with a scramjet engine, developed from DARPA’s HAWC concept under the SCIFiRE program with Australia. In October 2026 the Air Force confirmed the first drop of a flight test article over an Australian range. A rapid procurement decision is expected in 2027.',
      specs: [['Схема', 'ракетний прискорювач + ГПВРД-маршовий ступінь'], ['Перший носій', 'F-15E Strike Eagle'], ['Прототипів', '13 ракет']],
      specs_en: [['Configuration', 'rocket booster + scramjet sustainer stage'], ['First carrier', 'F-15E Strike Eagle'], ['Prototypes', '13 missiles']],
      links: [['Джерело: The War Zone', 'https://www.twz.com/air/first-release-of-usafs-new-hacm-hypersonic-cruise-missile-has-happened-over-a-test-range-in-australia'], ['Джерело: Interesting Engineering', 'https://interestingengineering.com/military/us-mach-5-hypersonic-cruise-missile-tested']] },
    { id: 'ls-prsm', name: 'PrSM (Precision Strike Missile)', maker: 'Lockheed Martin', country: 'США', type: 'missiles', stage: 'service', upd: '2026-09-21', q: 'PrSM',
      img: 'https://www.lockheedmartin.com/content/dam/lockheed-martin/mfc/photo/prsm/26-02367-TM-PrSM-Hero-1920.jpg',
      blurb: 'Оперативно-тактична балістична ракета, що замінює ATACMS у пускових HIMARS і M270. Increment 1 перебуває у серійному виробництві й уперше застосована в бою в березні 2026 року. У вересні 2026 року Lockheed отримала контракт до 1,2 млрд доларів на Increment 2 з багаторежимною ГСН для ураження рухомих наземних і морських цілей.',
      blurb_en: 'A tactical ballistic missile replacing ATACMS in HIMARS and M270 launchers. Increment 1 is in serial production and was first used in combat in March 2026. In September 2026 Lockheed received a contract worth up to $1.2 billion for Increment 2 with a multi-mode seeker for engaging moving land and maritime targets.',
      specs: [['Дальність', '60–499+ км'], ['Боєкомплект', '2 ракети в одному контейнері'], ['Пускові', 'HIMARS, M270']],
      specs_en: [['Range', '60–499+ km'], ['Load', '2 missiles per pod'], ['Launchers', 'HIMARS, M270']],
      links: [['Сайт виробника', 'https://www.lockheedmartin.com/en-us/products/precision-strike-missile.html'], ['Джерело: Lockheed Martin', 'https://news.lockheedmartin.com/2026-09-21-Lockheed-Martin-Secures-1-2B-Contract-for-Precision-Strike-Missile-Increment-2-After-Second-Maritime-Test'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/06/24/lockheed-martin-prsm-expanded/']] },
    { id: 'ls-typhon', name: 'Typhon (Mid-Range Capability)', maker: 'Lockheed Martin', country: 'США', type: 'missiles', stage: 'service', upd: '2026-10-21', q: 'Typhon',
      img: 'https://archetype-military-times-prod.web.arc-cdn.net/resizer/v2/I37PSTDAFZENBHQCYZBKWI4VHU.jpg?width=1200&auth=5c65e53d2162267a7720f796846eb7031027c9f51f3472e2b8f6072ebf30fe11',
      blurb: 'Наземний комплекс середньої дальності з вертикальними пусковими установками для ракет SM-6 і Tomahawk, який закриває нішу між PrSM і Dark Eagle. Батарею розгорнуто на Філіппінах з 2024 року, а в 2025 році SM-6 потопила морську ціль на навчаннях Talisman Sabre. Армія планує ще три батареї у 2026–2028 фінансових роках, зокрема для Європи; у жовтні 2026 р. повідомили, що батарея Багатодоменного командування «Європа» вперше провела пуск Tomahawk на полігоні Чайна-Лейк.',
      blurb_en: 'A ground-based mid-range system with vertical launchers for SM-6 and Tomahawk missiles, filling the gap between PrSM and Dark Eagle. A battery has been deployed in the Philippines since 2024, and in 2025 an SM-6 sank a maritime target during the Talisman Sabre exercise. The Army plans three more batteries in FY2026–2028, including for Europe; in October 2026 it was reported that the Multi-Domain Command – Europe battery had fired its first Tomahawk at China Lake.',
      specs: [['Ракети', 'SM-6, Tomahawk'], ['Дальність ураження', 'близько 500–2 000 км'], ['Батарея', '4 пускові установки + пункт управління']],
      specs_en: [['Missiles', 'SM-6, Tomahawk'], ['Engagement range', 'about 500–2,000 km'], ['Battery', '4 launchers + command post']],
      links: [['Джерело: CRS (Конгрес США)', 'https://www.everycrsreport.com/files/2026-04-20_IF12135_404a169e1db52dd1793b0baf381f04f2dc9d938a.html'], ['Джерело: Naval News', 'https://www.navalnews.com/naval-news/2026/10/u-s-army-anti-a2-ad-maritime-strike-unit-fires-tomahawk-missile/'], ['Джерело: Defense News', 'https://www.defensenews.com/land/2025/03/17/us-army-readies-second-typhon-battery-for-pacific-deployment/']] },
    { id: 'ls-eram', name: 'ERAM (Extended Range Attack Munition)', maker: 'CoAspire / Zone 5 Technologies', country: 'США', type: 'missiles', stage: 'prod', q: 'ERAM',
      img: 'https://static.kyivpost.com/storage/2026/02/04/c1a505a1bd73c82987643c689edb7984.jpg?w=1200&q=90&f=jpg',
      blurb: 'Недорога авіаційна міні-крилата ракета, створена в прискореному режимі для Повітряних сил України (варіанти RAACM від CoAspire та Rusty Dagger від Zone 5). США схвалили можливий продаж 3 350 ракет на 825 млн доларів. Перша партія з 840 одиниць запланована до постачання до кінця жовтня 2026 року.',
      blurb_en: 'A low-cost air-launched mini cruise missile developed on an accelerated schedule for the Ukrainian Air Force (variants: RAACM from CoAspire and Rusty Dagger from Zone 5). The US approved a possible sale of 3,350 missiles for $825 million. The first batch of 840 units is scheduled for delivery by the end of October 2026.',
      specs: [['Дальність', 'до ~400 км'], ['Перша партія', '840 ракет'], ['Схвалений продаж', '3 350 ракет, 825 млн дол.']],
      specs_en: [['Range', 'up to ~400 km'], ['First batch', '840 missiles'], ['Approved sale', '3,350 missiles, $825 million']],
      links: [['Джерело: Kyiv Post', 'https://www.kyivpost.com/post/69408'], ['Джерело: Defence Industry Europe', 'https://defence-industry.eu/united-states-speeds-delivery-of-new-eram-cruise-missiles-to-ukraine-under-fast-track-plan/']] },
    { id: 'ls-kf51', name: 'KF51 Panther', maker: 'Rheinmetall', country: 'Німеччина', type: 'land', stage: 'dev', upd: '2026-09-26', q: 'Panther',
      img: 'https://defence-industry.eu/wp-content/uploads/2026/09/Italy-lists-potential-E5.14-billion-contract-for-new-main-battle-tanks-raising-prospect-of-the-KF51-Panthers-first-production-order.jpeg',
      blurb: 'Основний бойовий танк нового покоління від Rheinmetall, розрахований на 130-мм гармату, з цифровою архітектурою та розвиненим захистом. Угорщина фінансує розробку версії KF51 EVO, а Італія через СП Leonardo Rheinmetall Military Vehicles готує контракт на новий танк вартістю до 5,14 млрд євро. Це може стати першим серійним замовленням платформи.',
      blurb_en: 'Rheinmetall’s next-generation main battle tank, designed for a 130 mm gun, with a digital architecture and advanced protection. Hungary is funding development of the KF51 EVO version, and Italy, through the Leonardo Rheinmetall Military Vehicles JV, is preparing a contract for a new tank worth up to €5.14 billion. This could become the platform’s first serial order.',
      specs: [['Гармата', '130 мм Rh-130 (120 мм L55A1 у версії EVO)'], ['Бойова маса', '59 т'], ['Екіпаж', '3–4 особи']],
      specs_en: [['Gun', '130 mm Rh-130 (120 mm L55A1 in EVO version)'], ['Combat weight', '59 t'], ['Crew', '3–4']],
      links: [['Сайт виробника', 'https://www.rheinmetall.com/en/media/news-watch/news/2023/12/2023-12-15-panther-developement-contract-hungary'], ['Джерело: Defence Industry Europe', 'https://defence-industry.eu/italy-lists-potential-e5-14-billion-contract-for-new-main-battle-tanks-raising-prospect-of-the-kf51-panthers-first-production-order/']] },
    { id: 'ls-m1e3', name: 'M1E3 Abrams', maker: 'General Dynamics Land Systems', country: 'США', type: 'land', stage: 'test', upd: '2026-10-06', q: 'M1E3',
      img: 'https://defence-industry.eu/wp-content/uploads/2026/10/U.S.-Army-conducts-live-fire-trials-of-M1E3-Abrams-tank-and-XM30-infantry-fighting-vehicle-prototypes-for-future-armored-forces-01.jpeg',
      blurb: 'Глибока переробка танка Abrams із безлюдною баштою, автоматом заряджання та екіпажем із трьох осіб у корпусі. Ранній прототип показали в січні 2026 року, а восени армія провела перші стрільби дослідних машин. Виробництво може стартувати приблизно через рік, залежно від результатів випробувань.',
      blurb_en: 'A deep redesign of the Abrams tank with an uncrewed turret, an autoloader and a three-person crew in the hull. An early prototype was shown in January 2026, and in the autumn the Army conducted the first live firing of the test vehicles. Production could start in about a year, depending on test results.',
      specs: [['Цільова маса', 'близько 60 т (проти 78 т у M1A2 SEPv3)'], ['Екіпаж', '3 особи'], ['Силова установка', 'дизель Caterpillar C13D + електромотор']],
      specs_en: [['Target weight', 'about 60 t (vs 78 t for M1A2 SEPv3)'], ['Crew', '3'], ['Powertrain', 'Caterpillar C13D diesel + electric motor']],
      links: [['Джерело: The War Zone', 'https://www.twz.com/land/m1e3-next-gen-abrams-tank-production-could-begin-next-year'], ['Джерело: Defence Industry Europe', 'https://defence-industry.eu/u-s-army-conducts-live-fire-trials-of-m1e3-abrams-tank-and-xm30-infantry-fighting-vehicle-prototypes-for-future-armored-forces/']] },
    { id: 'ls-xm30', name: 'XM30 (Wolf / Lynx)', maker: 'General Dynamics Land Systems / American Rheinmetall', country: 'США', type: 'land', stage: 'test', upd: '2026-10-06', q: 'XM30',
      img: 'https://www.gdls.com/wp-content/uploads/2026/09/Picture1-cropped.webp',
      blurb: 'Конкурсна програма бойової машини піхоти на заміну Bradley, у якій змагаються Wolf від GDLS та Lynx XM30 від American Rheinmetall. GDLS передала перший прототип армії 21 серпня 2026 року, і машини вже проходять вогневі випробування. Навесні 2027 року обидва варіанти перевірять у Національному навчальному центрі.',
      blurb_en: 'A competitive infantry fighting vehicle program to replace the Bradley, contested by GDLS’s Wolf and American Rheinmetall’s Lynx XM30. GDLS delivered its first prototype to the Army on 21 August 2026, and the vehicles are already undergoing live-fire testing. In spring 2027 both variants will be evaluated at the National Training Center.',
      specs: [['Гармата', '50 мм'], ['Місткість', '2 члени екіпажу + 6 піхотинців'], ['План закупівлі', '326 машин у 2027–2031 ф. р.']],
      specs_en: [['Gun', '50 mm'], ['Capacity', '2 crew + 6 infantry'], ['Procurement plan', '326 vehicles in FY2027–2031']],
      links: [['Сайт виробника', 'https://www.gdls.com/general-dynamics-land-systems-delivers-first-wolf-xm30-prototype-vehicle-to-u-s-army/'], ['Джерело: Defence Blog', 'https://defence-blog.com/u-s-armys-bradley-replacement-nears-a-major-testing-milestone/'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/09/04/general-dynamics-xm30-wolf/']] },
    { id: 'ls-cv90mk4', name: 'CV90 MkIV', maker: 'BAE Systems Hägglunds', country: 'Швеція', type: 'land', stage: 'prod', q: 'CV90',
      img: 'https://www.shephardmedia.com/media/cache/images/images/article/BAE_Systems_Hagglunds_Finland_Norway_Sweden_Lithuania_CV90_MkIV/99c574e1a3ce361eb38b68ad1fcc6c09.jpg',
      blurb: 'Новітня модифікація шведської БМП CV90 з потужнішим двигуном, підвищеною вантажопідйомністю та комплексом активного захисту. Литва схвалила закупівлю 100 машин, а Швеція, Фінляндія, Норвегія та Литва готують спільне замовлення понад 400 одиниць за майже єдиним стандартом MkIV. Портфель замовлень Hägglunds на CV90 сягнув 8 млрд доларів.',
      blurb_en: 'The latest variant of the Swedish CV90 IFV, with a more powerful engine, increased payload capacity and an active protection system. Lithuania has approved the purchase of 100 vehicles, and Sweden, Finland, Norway and Lithuania are preparing a joint order for over 400 units to a nearly common MkIV standard. Hägglunds’ CV90 order backlog has reached $8 billion.',
      specs: [['Повна маса', 'до 38 т'], ['Двигун', 'до 1 000 к. с.'], ['КАЗ', 'Iron Fist']],
      specs_en: [['Gross weight', 'up to 38 t'], ['Engine', 'up to 1,000 hp'], ['APS', 'Iron Fist']],
      links: [['Сайт виробника', 'https://www.baesystems.com/en/product/cv90'], ['Джерело: Shephard', 'https://www.shephardmedia.com/news/landwarfareintl/eurosatory-2026-nordic-cv90-contract-to-be-signed-this-year-as-best-offer-submitted/'], ['Джерело: Army Recognition', 'https://www.armyrecognition.com/news/army-news/2026/lithuania-approves-100-cv90-mkiv-infantry-fighting-vehicles-for-nato-force-modernization']] },
    { id: 'ls-rch155', name: 'Boxer RCH 155', maker: 'KNDS / Rheinmetall (ARTEC)', country: 'Німеччина', type: 'land', stage: 'prod', q: 'RCH 155',
      img: 'https://www.army-technology.com/wp-content/uploads/sites/3/2026/07/Rheinmetall-30.jpg',
      blurb: 'Колісна самохідна гаубиця на шасі Boxer з повністю автоматизованою безлюдною артилерійською частиною, похідною від PzH 2000. У травні 2026 року Велика Британія замовила 72 машини приблизно за 1 млрд фунтів, Німеччина також закуповує систему. Постачання британських гаубиць заплановані з травня 2028 до червня 2031 року.',
      blurb_en: 'A wheeled self-propelled howitzer on the Boxer chassis with a fully automated, uncrewed artillery module derived from the PzH 2000. In May 2026 the UK ordered 72 vehicles for about £1 billion, and Germany is also buying the system. Deliveries of the British howitzers are scheduled from May 2028 to June 2031.',
      specs: [['Гармата', '155 мм L/52'], ['Скорострільність', 'понад 8 пострілів/хв'], ['Екіпаж', '2 особи']],
      specs_en: [['Gun', '155 mm L/52'], ['Rate of fire', 'over 8 rounds/min'], ['Crew', '2']],
      links: [['Сайт виробника', 'https://knds.com/products/boxer/rch-155'], ['Джерело: Army Technology', 'https://www.army-technology.com/news/uk-rch-155-order-rheinmetall/'], ['Джерело: Rheinmetall', 'https://www.rheinmetall.com/en/media/news-watch/news/2026/07/2026-07-31-rheinmetall-delivers-weapon-systems-for-british-rch-155-wheeled-howitzer']] },
    { id: 'ls-k2', name: 'K2 Black Panther / K2PL', maker: 'Hyundai Rotem', country: 'Південна Корея', type: 'land', stage: 'service', q: 'K2 tank',
      img: 'https://notesfrompoland.com/wp-content/uploads/2026/04/1280px-K2_Tank_Joins_the_Fight_with_eFP_Battle_Group_Poland_-_2-1-e1777387139363.jpg',
      blurb: 'Південнокорейський основний бойовий танк з автоматом заряджання, який став головним експортним успіхом Hyundai Rotem у Європі. Польща вже отримала перші 180 танків і замовила ще 180, з них 64 у варіанті K2PL. У квітні 2026 року підписано угоду про складання K2PL на заводі Bumar-Łabędy в Глівіце з 2028 року.',
      blurb_en: 'A South Korean main battle tank with an autoloader that has become Hyundai Rotem’s main export success in Europe. Poland has already received its first 180 tanks and ordered 180 more, 64 of them in the K2PL variant. In April 2026 an agreement was signed to assemble the K2PL at the Bumar-Łabędy plant in Gliwice from 2028.',
      specs: [['Гармата', '120 мм L/55'], ['Бойова маса', 'близько 55–56 т'], ['Екіпаж', '3 особи (автомат заряджання)']],
      specs_en: [['Gun', '120 mm L/55'], ['Combat weight', 'about 55–56 t'], ['Crew', '3 (autoloader)']],
      links: [['Джерело: Notes from Poland', 'https://notesfrompoland.com/2026/04/29/poland-signs-agreement-to-produce-south-korean-k2-tanks-domestically/'], ['Джерело: The Defense Post', 'https://thedefensepost.com/2026/07/25/k2-black-panther-tank-guide/']] },
    { id: 'ls-sdapwsa', name: 'SDA Proliferated Warfighter Space Architecture', maker: 'Space Development Agency (York, Northrop Grumman та ін.)', country: 'США', type: 'space', stage: 'prod', upd: '2026-10-10', q: 'Space Development Agency',
      maker_en: 'Space Development Agency (York, Northrop Grumman and others)',
      img: 'https://www.airandspaceforces.com/app/uploads/2026/09/55114124062_dd1346ed8a_k.jpg',
      blurb: 'Мережа сотень малих супутників на низькій орбіті для передачі даних цілевказання та відстеження ракет, зокрема гіперзвукових. Після паузи з жовтня 2025 до липня 2026 року запуски Tranche 1 відновилися, а 10 жовтня 2026 року на орбіту вивели четверту площину транспортного шару. Для Tranche 3 замовлено 36 супутників відстеження в інтересах Golden Dome.',
      blurb_en: 'A network of hundreds of small low-Earth-orbit satellites for relaying targeting data and tracking missiles, including hypersonic ones. After a pause from October 2025 to July 2026, Tranche 1 launches resumed, and on 10 October 2026 the fourth plane of the Transport Layer was placed in orbit. For Tranche 3, 36 tracking satellites have been ordered in support of Golden Dome.',
      specs: [['План Tranche 1', '154 супутники'], ['На орбіті (вересень 2026)', '63 супутники Tranche 1'], ['Tranche 3', '36 супутників відстеження, ~1,75 млрд дол.']],
      specs_en: [['Tranche 1 plan', '154 satellites'], ['In orbit (September 2026)', '63 Tranche 1 satellites'], ['Tranche 3', '36 tracking satellites, ~$1.75 billion']],
      links: [['Сайт SDA', 'https://www.sda.mil/'], ['Джерело: Air & Space Forces Magazine', 'https://www.airandspaceforces.com/space-development-agency-two-more-launches-2026/']] },
    { id: 'ls-iris2', name: 'IRIS²', maker: 'SpaceRISE (SES, Eutelsat, Hispasat)', country: 'ЄС', type: 'space', stage: 'dev', q: 'IRIS2',
      img: 'https://runwaygirlnetwork.com/wp-content/uploads/2024/10/image007.jpg',
      blurb: 'Суверенне захищене супутникове угруповання ЄС для урядового й оборонного зв’язку на низькій і середній орбітах. 6 серпня 2026 року Єврокомісія та SpaceRISE підписали угоду, що додає 66 супутників і посилює вимоги безпеки. Перші запуски заплановано на 2029 рік.',
      blurb_en: 'The EU’s sovereign secure satellite constellation for government and defence communications in low and medium orbits. On 6 August 2026 the European Commission and SpaceRISE signed an agreement adding 66 satellites and tightening security requirements. First launches are planned for 2029.',
      specs: [['Угруповання', '348 супутників (330 LEO + 18 MEO)'], ['Перші запуски', '2029'], ['Промислові партнери', 'Airbus, Thales Alenia Space, OHB, Aerospacelab']],
      specs_en: [['Constellation', '348 satellites (330 LEO + 18 MEO)'], ['First launches', '2029'], ['Industrial partners', 'Airbus, Thales Alenia Space, OHB, Aerospacelab']],
      links: [['Сайт програми', 'https://defence-industry-space.ec.europa.eu/eu-space/iris2-secure-connectivity_en'], ['Джерело: SES', 'https://www.ses.com/news/press-release/commission-accelerates-iris2-deployment-with-enhanced-security-and-expanded'], ['Джерело: EUSPA', 'https://www.euspa.europa.eu/newsroom-events/news/commission-accelerates-iris2-deployment-enhanced-security-and-expanded']] },
    { id: 'ls-arsenal1', name: 'Arsenal-1', maker: 'Anduril Industries', country: 'США', type: 'industry', stage: 'prod', q: 'Arsenal-1',
      img: 'https://www.jobsohio.com/img/asset/c29jaWFsX2ltYWdlcy9hcnNlbmFsMXRvdXItMTktZWRpdGVkLSgxKS5qcGc/arsenal1tour-19-edited-%281%29.jpg?w=1200&h=630&fit=crop&s=6eb04c6a09d370b74531b3883f398878',
      blurb: 'Гігантський завод Anduril у Колумбусі (Огайо) для масового виробництва автономних систем із широким використанням комерційних компонентів. Виробництво безпілотного «веденого» YFQ-44A Fury стартувало в березні 2026 року, на кілька місяців раніше від плану, а перший серійний Fury зійшов з лінії 27 липня 2026 року.',
      blurb_en: 'Anduril’s giant plant in Columbus, Ohio, for mass production of autonomous systems with extensive use of commercial components. Production of the YFQ-44A Fury uncrewed wingman began in March 2026, several months ahead of schedule, and the first production Fury rolled off the line on 27 July 2026.',
      specs: [['Площа', 'до 5 млн кв. футів на 500 акрах'], ['Інвестиції', '910,5 млн дол.'], ['Потужність лінії Fury', 'до 150 літаків на рік']],
      specs_en: [['Area', 'up to 5 million sq ft on 500 acres'], ['Investment', '$910.5 million'], ['Fury line capacity', 'up to 150 aircraft per year']],
      links: [['Сайт виробника', 'https://www.anduril.com/arsenal'], ['Джерело: JobsOhio', 'https://www.jobsohio.com/newsroom/news-press/first-ohio-built-fury-rolls-off-andurils-arsenal-1-production-line'], ['Джерело: Defense One', 'https://www.defenseone.com/threats/2026/03/anduril-new-factory-will-start-making-drone-wingman-just-days/412227']] },
    { id: 'ua-freya', name: 'Freya (Фрея)', maker: 'Fire Point та міжнародна коаліція', country: 'Україна', type: 'missiles', stage: 'dev', upd: '2026-09-30', q: 'Freya',
      name_en: 'Freya', maker_en: 'Fire Point and an international coalition',
      img: 'https://mezha.net/ua/kd_image_generate/aebb76d2_zelensky_launched_freya/1124925.jpg?ver=2.0.17',
      blurb: 'Українська програма протибалістичної ППО, яку Володимир Зеленський оголосив 13 липня 2026 року в Парижі разом із коаліцією європейських держав. Ключовий промисловий партнер — Fire Point. Мета — дешевий перехоплювач, який можна масово виробляти без американських компонентів, як альтернатива дефіцитним ракетам PAC-3. Прототип очікують до середини 2027 року.',
      blurb_en: 'A Ukrainian anti-ballistic air defence program announced by Volodymyr Zelensky on 13 July 2026 in Paris together with a coalition of European states. The key industrial partner is Fire Point. The goal is a cheap interceptor that can be mass-produced without American components, as an alternative to scarce PAC-3 missiles. A prototype is expected by mid-2027.',
      specs: [['Орієнтовна вартість пострілу', 'близько $700 тис. (за даними джерел)'], ['Країни-учасниці', '10 (Україна, Франція, Велика Британія, Німеччина та інші)'], ['Перше перехоплення', 'план — середина 2027 року']],
      specs_en: [['Estimated cost per shot', 'about $700 thousand (according to sources)'], ['Participating countries', '10 (Ukraine, France, United Kingdom, Germany and others)'], ['First interception', 'planned for mid-2027']],
      links: [['Джерело: Межа', 'https://mezha.net/ua/?p=1124925'], ['Джерело: LB.ua', 'https://lb.ua/tech/2026/09/30/770190_pershe_boyove_viprobuvannya.html'], ['Джерело: Euromaidan Press', 'https://euromaidanpress.com/2026/07/09/ukraine-is-building-its-own-ballistic-interceptor-for-700000-per-shot-eight-countries-may-join-project/']] },
    { id: 'ua-fp7', name: 'FP-7', maker: 'Fire Point', country: 'Україна', type: 'missiles', stage: 'test', upd: '2026-10-01', q: 'FP-7',
      img: 'https://militarnyi.com/wp-content/uploads/2026/07/BALISTYCHNA-RAKETA-FP-7-2-.jpg',
      blurb: 'Тактична балістична ракета компанії Fire Point. Її вперше показали на виставці MSPO у вересні 2025 року, а з вересня 2026-го вона проходить військові випробування. Перше бойове застосування Зеленський оголосив 1 жовтня 2026 року. На базі FP-7 розробляють і перехоплювач для програми Freya.',
      blurb_en: 'Fire Point’s tactical ballistic missile. It was first shown at the MSPO exhibition in September 2025 and has been undergoing military trials since September 2026. Zelensky announced its first combat use on 1 October 2026. An interceptor for the Freya program is also being developed on the basis of the FP-7.',

    { id: 'nv-saildrone-voyager', name: 'Saildrone Voyager', maker: 'Saildrone', country: 'США', type: 'unmanned', stage: 'service', upd: '2026-09-24', q: 'Saildrone',

    { id: 'nv-haikun', name: 'Підводний човен Hai Kun (SS-711)', maker: 'CSBC Corporation, Taiwan', country: 'Тайвань', type: 'naval', stage: 'test', upd: '2026-09-22', q: 'Hai Kun',

    { id: 'ew-ngj', name: 'Next Generation Jammer Mid-Band (AN/ALQ-249)', maker: 'Raytheon (RTX)', country: 'США', type: 'electronic', stage: 'service', q: 'Next Generation Jammer',

    { id: 'ew-ea37b', name: 'EA-37B Compass Call', maker: 'L3Harris / BAE Systems / Gulfstream', country: 'США', type: 'electronic', stage: 'service', q: 'Compass Call',

    { id: 'ew-ironstone', name: 'Ironstone Opal / GravNav (квантова навігація)', maker: 'Q-CTRL', country: 'Австралія', type: 'electronic', stage: 'test', q: 'Q-CTRL',
      name_en: 'Ironstone Opal / GravNav (Quantum Navigation)',
      img: 'https://cdn.prod.website-files.com/64fe49580f2049d94a40e0fe/6a90d10d5bea5472e5b2e645_6a8f8cd39a0327efa120b165_Q-CTRL%20GravNav%20test%20system-optimized.webp',
      blurb: 'Квантові навігаційні системи, що визначають місцезнаходження без GPS за аномаліями магнітного (MagNav) або гравітаційного (GravNav) поля Землі і тому не піддаються глушінню чи спуфінгу. У серпні 2026 року Q-CTRL провела в Кораловому морі перше морське випробування гравіметричної навігації без GPS.',
      blurb_en: 'Quantum navigation systems that determine position without GPS using anomalies in the Earth’s magnetic (MagNav) or gravity (GravNav) field, making them immune to jamming and spoofing. In August 2026 Q-CTRL conducted the first maritime trial of GPS-free gravimetric navigation in the Coral Sea.',
      specs: [['Точність (морське випробування)', 'близько 1 морської милі'], ['Перевага над резервними засобами GNSS', 'понад 10 разів (за даними компанії)'], ['Партнери', 'DARPA, DIU, Міноборони Австралії, Royal Navy']],
      specs_en: [['Accuracy (maritime trial)', 'about 1 nautical mile'], ['Advantage over GNSS backup systems', 'more than 10x (per the company)'], ['Partners', 'DARPA, DIU, Australian Department of Defence, Royal Navy']],
      links: [['Сайт виробника', 'https://q-ctrl.com/blog/q-ctrl-achieves-worlds-first-gps-free-quantum-gravimetric-navigation-demonstration-in-maritime-field-trial'], ['Джерело: The Quantum Insider', 'https://thequantuminsider.com/2026/08/27/q-ctrl-demonstrates-gps-free-quantum-gravimetric-navigation-demonstration-in-maritime-field-trial/']] },
    { id: 'ew-kalaetron', name: 'Kalaetron Attack', maker: 'Hensoldt', country: 'Німеччина', type: 'electronic', stage: 'test', q: 'Kalaetron',

      blurb_en: 'A US Army program to create a new command and control architecture: a common data layer, cloud applications and AI in place of disparate headquarters systems. Prototypes were tested by the 4th Infantry Division (Anduril) and the 25th Infantry Division (Lockheed Martin); in June 2026 Anduril was selected as lead developer of the core common data layer.',

    { id: 'ew-arexis', name: 'Arexis', maker: 'Saab', country: 'Швеція', type: 'electronic', stage: 'prod', q: 'Arexis',

    { id: 'ew-hivemind', name: 'Hivemind', maker: 'Shield AI', country: 'США', type: 'ai', stage: 'prod', q: 'Hivemind',
      img: 'https://eu-images.contentstack.com/v3/assets/blt6b0f74e5591baa03/bltd23b69bacc033855/69ca8a3a7edf53274e56097e/Shield.jpg?disable=upscale&width=1200&height=630&fit=crop',

    { id: 'ew-altra', name: 'Altra', maker: 'Helsing', country: 'Німеччина', type: 'ai', stage: 'prod', q: 'Helsing',

      blurb: 'Програмна платформа «розвідка–ураження» для сухопутних військ, яка зводить дані дронів, спостерігачів та інших сенсорів у спільну оперативну картину й пропонує розподіл цілей між засобами ураження. Підтримує артилерію, міномети та рої ударних дронів, зокрема HX-2, і розрахована на роботу в умовах сильної РЕБ.',

    { id: 'ew-dronedome', name: 'Drone Dome', maker: 'Rafael', country: 'Ізраїль', type: 'electronic', stage: 'service', q: 'Drone Dome',

      blurb: 'Комплекс протидії безпілотникам, що поєднує радар, оптико-електронні сенсори, засоби радіоелектронного придушення та, за потреби, лазерний ефектор для кругового захисту об’єктів. На Eurosatory 2026 Rafael показала його разом із новою лінійкою кінетичних і лазерних засобів боротьби з дронами.',

    { id: 'ew-synaps', name: 'SYNAPS', maker: 'Thales', country: 'Франція', type: 'electronic', stage: 'prod', q: 'SYNAPS',

    { id: 'ew-starshield', name: 'Starshield / MILNET', maker: 'SpaceX', country: 'США', type: 'space', stage: 'prod', q: 'Starshield',
      blurb: 'Військова версія супутникової мережі Starlink із посиленим шифруванням, на основі якої для Космічних сил США розгортають захищену низькоорбітальну мережу зв’язку MILNET. У травні 2026 року SpaceX отримала контракт на 2,29 млрд доларів на створення магістральної мережі передачі даних для системи протиракетної оборони Golden Dome.',
      blurb_en: 'A military version of the Starlink satellite network with enhanced encryption, which is the basis for the secure low-orbit MILNET communications network being deployed for the US Space Force. In May 2026 SpaceX received a $2.29 billion contract to build the data transport backbone for the Golden Dome missile defence system.',
      specs: [['MILNET', 'понад 480 супутників (план)'], ['Контракт Space Data Network', '2,29 млрд дол.'], ['Прототип', 'до кінця 2027 р.']],

    { id: 'ew-bittium', name: 'Bittium Tough SDR / TAC WIN', maker: 'Bittium', country: 'Фінляндія', type: 'electronic', stage: 'service', q: 'Bittium',

    { id: 'as-kf21', name: 'KF-21 Boramae', maker: 'Korea Aerospace Industries (KAI)', country: 'Південна Корея', type: 'air', stage: 'prod', upd: '2026-09-22', q: 'KF-21',

    { id: 'as-amca', name: 'AMCA (Advanced Medium Combat Aircraft)', maker: 'ADA / DRDO', country: 'Індія', type: 'air', stage: 'dev', q: 'AMCA',
      img: 'https://idrw.org/wp-content/uploads/2026/05/p5db.png',
      blurb: 'Індійський малопомітний винищувач п’ятого покоління з внутрішніми відсіками озброєння, злиттям даних сенсорів і надзвуковим крейсерським польотом. Розробник — ADA, а партнера з виготовлення прототипів обирають серед трьох консорціумів: Tata Advanced Systems, L&T-BEL-Dynamatic і Bharat Forge-BEML-Data Patterns. Переможця очікують оголосити на початку 2027 року.',

      specs: [['Двигуни прототипів', '2 × GE F414'], ['Затвердження CCS', 'березень 2024 р.'], ['Вибір партнера', 'очікується у січні–березні 2027 р.']],

      links: [['Джерело: IDRW', 'https://idrw.org/amca-programme-enters-final-phase-prototype-contract-award-expected-in-early-2027/'], ['Джерело: IDRW (аналіз затримок)', 'https://idrw.org/?p=401396']] },
    { id: 'as-tejas-mk2', name: 'Tejas Mk2 (Medium Weight Fighter)', maker: 'HAL / ADA', country: 'Індія', type: 'air', stage: 'dev', q: 'Tejas Mk2',
      img: 'https://akm-img-a-in.tosshub.com/aajtak/images/story/202504/67ff4ea1e03b7-tejas-mk2-fighter-jet-163051949-16x9.jpg?size=948:533',
      blurb: 'Збільшений і важчий розвиток індійського легкого винищувача Tejas з передніми горизонтальними рулями, більшим запасом пального та радаром Uttam AESA. Перший прототип ще збирають; за даними HAL, перший політ заплановано на березень–липень 2027 року. Літак має замінити Mirage 2000, Jaguar і MiG-29 у ВПС Індії.',
      blurb_en: 'A larger and heavier development of India’s Tejas light fighter with canards, greater fuel capacity and the Uttam AESA radar. The first prototype is still being assembled; according to HAL, the first flight is planned for March–July 2027. The aircraft is to replace the Mirage 2000, Jaguar and MiG-29 in the Indian Air Force.',

    { id: 'as-brahmos-ng', name: 'BrahMos-NG', maker: 'BrahMos Aerospace', country: 'Індія', type: 'missiles', stage: 'dev', q: 'BrahMos-NG',
      blurb: 'Полегшена версія надзвукової крилатої ракети BrahMos, приблизно вдвічі легша й майже на три метри коротша за базову. Мета — розмістити її на значно ширшому колі літаків, зокрема на Tejas, а згодом і на підводних човнах із запуском через торпедний апарат. Перші льотні випробування авіаційної версії заплановано на кінець 2026 року.',
      blurb_en: 'A lightweight version of the BrahMos supersonic cruise missile, roughly half the weight and almost three metres shorter than the baseline. The aim is to fit it on a much wider range of aircraft, including Tejas, and later on submarines with launch via torpedo tube. The first flight tests of the air-launched version are planned for late 2026.',
      specs: [['Маса', '~на 50% менша за BrahMos'], ['ГСН', 'вітчизняна AESA'], ['Носії', 'Su-30MKI (до 3), Tejas (до 2)']],

      links: [['Джерело: IDRW', 'https://idrw.org/?p=408033']] },
    { id: 'as-akash-ng', name: 'Akash-NG', maker: 'DRDO / Bharat Dynamics / BEL', country: 'Індія', type: 'missiles', stage: 'test', q: 'Akash-NG',

    { id: 'as-type12-upg', name: 'Модернізована протикорабельна ракета Type 12', maker: 'Mitsubishi Heavy Industries', country: 'Японія', type: 'missiles', stage: 'service', q: 'Type 12',

    { id: 'as-hvgp', name: 'HVGP (Type 25 Hyper Velocity Gliding Projectile)', maker: 'ATLA', country: 'Японія', type: 'missiles', stage: 'service', q: 'HVGP',

    { id: 'as-tdome', name: 'T-Dome', maker: 'Міністерство національної оборони Тайваню / NCSIST', country: 'Тайвань', type: 'missiles', stage: 'dev', q: 'T-Dome',

    { id: 'as-j35', name: 'J-35 / J-35A', maker: 'Shenyang Aircraft Corporation (AVIC)', country: 'Китай', type: 'air', stage: 'prod', q: 'J-35',

    { id: 'as-davids-sling', name: 'David’s Sling (Праща Давида)', maker: 'Rafael / RTX', country: 'Ізраїль', type: 'missiles', stage: 'service', q: 'David’s Sling',
